/* =========================================================
   STARTUP / WELCOME SCREEN
========================================================= */

#firaStartup {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #001a66;

    z-index: 999999999;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    opacity: 1;

    visibility: visible;

    transition:
        opacity .45s ease,
        visibility .45s ease;

}

#firaStartup.hidden {

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

}

.firaStartupImage {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;

}

.firaStartupLoading {

    position: absolute;

    left: 50%;

    bottom: 42px;

    transform: translateX(-50%);

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 10px;

    color: #ffffff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 13px;

    font-weight: 600;

    text-shadow:
        0 2px 6px
        rgba(0,0,0,.6);

}

.firaLoadingSpinner {

    width: 30px;
    height: 30px;

    border-radius: 50%;

    border:
        3px solid
        rgba(255,255,255,.3);

    border-top-color:
        #ffffff;

    animation:
        firaSpin .75s linear infinite;

}

@keyframes firaSpin {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}


/* =========================================================
   MENU DRAWER
========================================================= */

.menu-iframe-overlay.active {

}

.menu-iframe-drawer {

    left: 0;

    transform:

<script type="module">

/* =========================================================

import {

import {
    getDatabase,

} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyCqwgwiukwKb7o6gwnaLoPQSWc7bFmdYQ",

    messagingSenderId:
        "641705823615",

    appId:
        "1:641705823615:web:6502b2511ff8c0f251de4a",

    measurementId:
        "G-2YSX71N08Q"

};


const app =
    initializeApp(
        firebaseConfig
    );

const db =
    getDatabase(app);

const APP_NODE_NAME =
    "app1";


/* =========================================================
   DATA
========================================================= */

let rawShikelaNewsData = {};

let rawNewNewsData = {};

let localCachedBroadcasts = [];

let currentActiveCategoryFilter =
    "Shikela Update";


/* =========================================================
   ADS
========================================================= */

const TEST_AD_IDS = {

    banner:
        "ca-app-pub-3940256099942544/6300978111",

    interstitial:
        "ca-app-pub-3940256099942544/1033173712",

    rewarded:
        "ca-app-pub-3940256099942544/5224354917",

    rewardedInterstitial:
        "ca-app-pub-3940256099942544/5354046379",

    native:
        "ca-app-pub-3940256099942544/2247696110",

    appOpen:
        "ca-app-pub-3940256099942544/9257395921"

};


window.globalAdConfig = {

    status: true,

    bannerId:
        TEST_AD_IDS.banner,

    interstitialId:
        TEST_AD_IDS.interstitial,

    rewardedId:
        TEST_AD_IDS.rewarded,

    rewardedInterstitialId:
        TEST_AD_IDS.rewardedInterstitial,

    nativeId:
        TEST_AD_IDS.native,

    appOpenId:
        TEST_AD_IDS.appOpen,

    interstitialInterval:
        3,

    placements: {},

    isTesting: true

};


let adMobInitialized =
    false;

let bannerCreated =
    false;

let articleClickCount =
    0;

let firstAppOpenShown =
    false;

let currentNativeAdElementId =
    null;

let nativeAdPositionFrame =
    null;


/* =========================================================
   FEED
========================================================= */

let currentVisibleFeedCount =
    0;

let isFetchingMore =
    false;

const FEED_BATCH_SIZE =
    3;


/* =========================================================
   STARTUP SCREEN
========================================================= */

(function setupStartupScreen() {

    const startup =
        document.getElementById(
            "firaStartup"
        );

    if (!startup) {
        return;
    }

    let closed =
        false;

    function closeStartup() {

        if (closed) {
            return;
        }

        closed = true;

        startup.classList.add(
            "hidden"
        );

        setTimeout(
            () => {

                if (
                    startup &&
                    startup.parentNode
                ) {

                    startup.parentNode
                        .removeChild(
                            startup
                        );

                }

            },
            500
        );

    }

    if (
        document.readyState ===
        "complete"
    ) {

        setTimeout(
            closeStartup,
            250
        );

    } else {

        window.addEventListener(
            "load",
            () => {

                setTimeout(
                    closeStartup,
                    250
                );

            },
            {
                once: true
            }
        );

    }

})();


/* =========================================================
   INIT
========================================================= */

function initApp() {

    adjustBottomNavigationOffsets();

    detectPlatform();

    fetchDatabaseAdConfig();

    streamLiveAdminUpdatesLog();

    bindVisualInterfaceControls();

    setupSearchEngineControls();

    setupIntersectionObserver();

}


if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        initApp
    );

} else {

    initApp();

}


/* =========================================================
   PLATFORM
========================================================= */

function isNativeApp() {

    return Boolean(

        window.Capacitor &&

        typeof
            window.Capacitor
                .isNativePlatform
            === "function" &&

        window.Capacitor
            .isNativePlatform()

    );

}


function detectPlatform() {

    if (
        isNativeApp()
    ) {

        document.body
            .classList
            .remove(
                "web-version"
            );

    } else {

        document.body
            .classList
            .add(
                "web-version"
            );

    }

}


/* =========================================================
   GET NEXTGEN ADMOB
========================================================= */

function getAdMobPlugin() {

    if (
        !isNativeApp()
    ) {

        return null;

    }

    if (
        !window.Capacitor ||
        !window.Capacitor.Plugins
    ) {

        return null;

    }

    return (
        window.Capacitor
            .Plugins
            .AdMob
    ) || null;

}


/* =========================================================
   ADMOB CONFIG HELPERS
========================================================= */

function firebaseBoolean(value) {

    return (

        value === true ||

        value === "true" ||

        value === "TRUE" ||

        value === "ON" ||

        value === "on" ||

        value === 1

    );

}


function cleanAdId(
    value,
    fallback
) {

    const id =
        String(
            value || ""
        ).trim();

    return id || fallback;

}


/* =========================================================
   FIREBASE AD CONFIG
========================================================= */

function fetchDatabaseAdConfig() {

    const adManagerRef =
        ref(
            db,
            `${APP_NODE_NAME}/adManager`
        );


    onValue(
        adManagerRef,
        async snapshot => {

            if (
                !snapshot.exists()
            ) {

                window.globalAdConfig = {

                    status: true,

                    bannerId:

/* =========================================================
   INITIALIZE NEXTGEN ADMOB
========================================================= */

async function initializeNativeAdMob() {

    const AdMob =
        getAdMobPlugin();

    if (!AdMob) {

        console.warn(
            "AdMob NextGen plugin not available."
        );

        return;

    }


    if (
        !window.globalAdConfig.status
    ) {

        await hideAllAds();

        return;

    }


    try {

        /*
         * STEP 1
         * Consent must happen first.
         */

        if (
            typeof
                AdMob.requestConsentInfo
            === "function"
        ) {

            await AdMob
                .requestConsentInfo({})
                .catch(
                    error => {

                        console.warn(
                            "Consent:",
                            error
                        );

                    }
                );

        }


        /*
         * STEP 2
         * Initialize SDK.
         */

        await AdMob.initialize({

            isTesting:
                window.globalAdConfig
                    .isTesting,

            maxAdContentRating:
                "G"

        });


        adMobInitialized =
            true;


        /*
         * STEP 3
         * Load ads.
         */

        await loadAllAds();


        /*
         * Banner
         */

        setTimeout(
            () => {

                triggerBannerAd();

            },
            500
        );


        /*
         * Native feed ad
         */

        setTimeout(
            () => {

                loadVisibleNativeAd();

            },
            1200
        );


        /*
         * App Open
         *
         * Shown once after initial app
         * initialization.
         */

        if (
            window.globalAdConfig
                .placements
                ?.appOpenOnLaunch
                !== false
        ) {

            setTimeout(
                () => {

                    showAppOpenAd();

                },
                900
            );

        }


    } catch (error) {

        console.error(
            "AdMob initialization:",
            error
        );

    }

}

async function triggerBannerAd() {

    const AdMob =
        getAdMobPlugin();

    if (
        !isNativeApp() ||
        !AdMob
    ) {

        triggerWebsiteFallback();

        return;

    }


    if (
        !window.globalAdConfig.status
    ) {

        await hideBannerAd();

        return;

    }


    const shouldShow =
        window.globalAdConfig
            .placements
            ?.bannerAdHomePage
            !== false;


    if (!shouldShow) {

        await hideBannerAd();

        return;

    }


    if (
        !window.globalAdConfig.bannerId
    ) {

        return;

    }


    try {

        /*

         * adaptive banner.
         */

        if (
            !bannerCreated
        ) {

            await AdMob.createBanner({

                adUnitId:
                    window.globalAdConfig
                        .bannerId,

                isAutoShow:
                    true,

                position:
                    "BOTTOM",

                adSize:
                    "ADAPTIVE",

                isOverlap:
                    true,

                isCollapsible:
                    false,

                retryInterval:
                    5000

            });

            bannerCreated =
                true;

        } else {

            await AdMob
                .showBanner();

        }


        const fallback =
            document.getElementById(
                "adContainerWrapper"

        if (fallback) {

            fallback.style.display =

    } catch (error) {

/* =========================================================
   LOAD REAL NEXTGEN NATIVE AD
========================================================= */

async function loadNativeAdForElement(
    elementId
) {

    if (
        !isNativeApp()
    ) {

        return;

    }


    if (
        !window.globalAdConfig.status
    ) {

        return;

    }


    const AdMob =
        getAdMobPlugin();

    if (!AdMob) {

        console.warn(
            "AdMob plugin unavailable."
        );

        return;

    }


    if (
        typeof
            AdMob.showNativeAd
        !== "function"
    ) {

        console.warn(
            "showNativeAd() is unavailable."
        );

        return;

    }


    const element =
        document.getElementById(
            elementId
        );

    if (!element) {
        return;
    }


    currentNativeAdElementId =
        elementId;


    const rect =
        element.getBoundingClientRect();


    const visible =

        rect.bottom > 0 &&

        rect.top <
            window.innerHeight;


    if (!visible) {

        return;

    }


    const width =
        Math.max(
            1,
            Math.round(
                rect.width
            )
        );


    const height =
        350;


    const adUnitId =
        (
            window.globalAdConfig
                .nativeId ||
            TEST_AD_IDS.native
        ).trim();


    try {

        /*
         * IMPORTANT:
         *
         * This is the REAL Native AdMob
         * NextGen API.
         *
         * It creates Google's native
         * Android NativeAdView template.
         */

        const result =
            await AdMob.showNativeAd({

                adUnitId,

                template:
                    "medium",

                x:
                    Math.max(
                        0,
                        Math.round(
                            rect.left
                        )
                    ),

                y:
                    Math.max(
                        0,
                        Math.round(
                            rect.top
                        )
                    ),

                width,

                height,

                retryInterval:
                    5000

            });


        console.log(
            "REAL Native Ad loaded:",
            result
        );


    } catch (error) {

        console.error(
            "Native Ad error:",
            error
        );

    }

}


/* =========================================================
   FIND VISIBLE NATIVE AD
========================================================= */

function loadVisibleNativeAd() {

    if (
        !isNativeApp()
    ) {

        return;

    }


    if (
        !window.globalAdConfig.status
    ) {

        return;

    }


    const slots =
        document.querySelectorAll(
            ".inline-feed-ad-slot"
        );


    if (
        slots.length === 0
    ) {

        return;

    }


    let selectedSlot =
        null;


    for (
        const slot of slots
    ) {

        const rect =
            slot.getBoundingClientRect();


        if (

            rect.bottom > 0 &&

            rect.top <
                window.innerHeight

        ) {

            selectedSlot =
                slot;

            break;

        }

    }


    if (
        !selectedSlot
    ) {

        selectedSlot =
            slots[0];

    }


    if (
        !selectedSlot
    ) {

        return;

    }


    if (
        currentNativeAdElementId ===
        selectedSlot.id
    ) {

        updateNativeAdPosition();

        return;

    }


    loadNativeAdForElement(
        selectedSlot.id
    );

}


/* =========================================================
   UPDATE NATIVE AD
========================================================= */

function updateNativeAdPosition() {

    if (
        !isNativeApp()
    ) {

        return;

    }


    if (
        !currentNativeAdElementId
    ) {

        loadVisibleNativeAd();

        return;

    }


    if (
        nativeAdPositionFrame
    ) {

        return;

    }


    nativeAdPositionFrame =
        requestAnimationFrame(
            () => {

                nativeAdPositionFrame =
                    null;


                const element =
                    document.getElementById(
                        currentNativeAdElementId
                    );


                if (!element) {

                    currentNativeAdElementId =
                        null;

                    loadVisibleNativeAd();

                    return;

                }


                const rect =
                    element.getBoundingClientRect();


                const visible =

                    rect.bottom > 0 &&

                    rect.top <
                        window.innerHeight;


                if (!visible) {

                    const AdMob =
                        getAdMobPlugin();


                    if (
                        AdMob &&
                        typeof
                            AdMob.hideNativeAd
                        === "function"
                    ) {

                        AdMob
                            .hideNativeAd()
                            .catch(
                                () => {}
                            );

                    }

                    currentNativeAdElementId =
                        null;

                    loadVisibleNativeAd();

                }

            }
        );

}

        ) {

            if (AdMob) {

                const interval =
                    Math.max(

                        1,

                        Number(
                            window.globalAdConfig
                                .interstitialInterval
                        ) || 3

                    );


                /*
                 * Interstitial every N clicks.
                 */

                if (

                    articleClickCount %
                        interval
                    ===
                    0 &&

                        .interstitialId

                ) {

                    try {

                            .showInterstitial();


                        await AdMob
                            .loadInterstitial({

                                    window.globalAdConfig
                                        .interstitialId,

                                retryInterval:

                            })
                            .catch(
                                () => {}
                            );


                    } catch (error) {

                        console.warn(
                            "Interstitial skipped:",
                            error
                        );


                        /*
                         * Try loading another one
                         * if current one wasn't ready.
                         */

                        await AdMob
                            .loadInterstitial({

                                adUnitId:
                                    window.globalAdConfig
                                        .interstitialId,

                                retryInterval:
                                    5000

                            })
                            .catch(
                                () => {}
                            );

                    }

                }


                /*

                    === "function"
                ) {

                    await AdMob
                        .hideNativeAd()
                        .catch(

                        );

                }

            }

        }


        window.location.href =
            targetUrl;

    };


/* =========================================================
   TIMESTAMP
========================================================= */

function extractValidTimestamp(
    item
) {

    const raw =

        item.timestamp ||

        item.updatedAt ||

        item.createdAtTimestamp ||

        item.createdAt ||

        item.date;


    if (

        typeof raw === "number" &&

        !isNaN(raw)

    ) {

        return raw;

    }


    if (
        typeof raw === "string"
    ) {

        const parsed =
            parseInt(
                raw,
                10
            );


        if (

            !isNaN(parsed) &&

            parsed >
                1000000000

        ) {

            return parsed <
                100000000000

                ? parsed * 1000

                : parsed;

        }


        const dateParsed =
            new Date(
                raw
            ).getTime();


        if (
            !isNaN(dateParsed)
        ) {

            return dateParsed;

        }

    }


    return Date.now();

}


/* =========================================================
   CACHE
========================================================= */

function rebuildAndRenderBroadcastsCache() {

    localCachedBroadcasts =
        [];


    const addNode =
        (
            dataObj,
            defaultCat,
            nodeName
        ) => {

            Object.keys(
                dataObj || {}
            )
            .forEach(
                key => {

                    const item =
                        dataObj[key];


                    if (

                        typeof item ===
                            "object" &&

                        item !== null

                    ) {

                        localCachedBroadcasts
                            .push({

                                id:
                                    key,

                                sourceNode:
                                    nodeName,

                                ...item,

                                title:
                                    item.title ||
                                    item.newsTitle ||
                                    defaultCat,

                                category:
                                    item.category ||
                                    defaultCat,

                                resolvedTimestamp:
                                    extractValidTimestamp(
                                        item
                                    )

                            });

                    }

                }
            );

        };


    addNode(
        rawShikelaNewsData,
        "Shikela Update",
        "shikelaNews"
    );


    addNode(
        rawNewNewsData,
        "Shikela Tips",
        "newNews"
    );


    localCachedBroadcasts.sort(
        (a,b) =>
            b.resolvedTimestamp -
            a.resolvedTimestamp
    );


    renderFilteredBroadcasts(
        true
    );

}

                            displayCategory
                        )}

                    </span>

                </div>


                <span
                    class="timestamp-log-text"
                    data-timestamp="${numericalTime}">

                </span>

            </div>


            ${imageHTML}


            <div
                class="clickable-news-content">

                <h2
                    class="broadcast-title">

                    ${escapeHTML(
                        headline
                    )}

                </h2>


                <p
                    class="broadcast-body-text">

                    ${escapeHTML(
                        previewContent
                    )}

                </p>

            </div>

        </div>

    `;

}


/* =========================================================
   SECURITY
========================================================= */

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /[&<>"']/g,
        char =>

            ({

                "&":
                    "&amp;",

                "<":
                    "&lt;",

                ">":
                    "&gt;",

                '"':
                    "&quot;",

                "'":
                    "&#039;"

            })[char]

    );

}


function escapeJS(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /\r?\n/g,
        "\\n"
    );

}


/* =========================================================
   RENDER FEED
========================================================= */

function renderFilteredBroadcasts(
    reset = false
) {

    const container =
        document.getElementById(
            "broadcastsContainer"
        );


    if (!container) {
        return;
    }


    const filtered =
        localCachedBroadcasts.filter(

            item =>

                (
                    item.category ||
                    ""
                )
                .trim()
                .toLowerCase()
                ===
                currentActiveCategoryFilter
                    .trim()
                    .toLowerCase()

        );


    if (reset) {

        container.innerHTML =
            "";

        currentVisibleFeedCount =
            0;

        currentNativeAdElementId =
            null;


        const AdMob =
            getAdMobPlugin();

        if (
            AdMob &&
            typeof
                AdMob.hideNativeAd
            === "function"
        ) {

            AdMob
                .hideNativeAd()
                .catch(
                    () => {}
                );

        }

    }


    if (
        filtered.length === 0
    ) {

        if (reset) {

            container.innerHTML = `

                <article
                    class="featured-broadcast-card">

                    <h2
                        class="broadcast-title">

                        No updates posted today.

                    </h2>

                </article>

            `;

        }


        updateLoaderUI();

        return;

    }


    const nextBatch =
        filtered.slice(

            currentVisibleFeedCount,

            currentVisibleFeedCount +
                FEED_BATCH_SIZE

        );


    if (
        nextBatch.length === 0
    ) {

        updateLoaderUI();

        return;

    }


    nextBatch.forEach(
        item => {


            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "featured-broadcast-card";


            card.innerHTML =
                buildSingleNewsCardHTML(
                    item
                );


            container.appendChild(
                card
            );


            currentVisibleFeedCount++;


            /*
             * REAL NATIVE AD
             *
             * Insert after article #2.
             */

            if (

                currentVisibleFeedCount ===
                2 &&

                window.globalAdConfig.status &&

                isNativeApp() &&

                window.globalAdConfig
                    .placements
                    ?.nativeAdPostList
                    !== false

            ) {

                const adContainerId =
                    "native-ad-feed";


                const existingAd =
                    document.getElementById(
                        adContainerId
                    );


                if (!existingAd) {

                    const wrapper =
                        document.createElement(
                            "div"
                        );


                    wrapper.innerHTML =
                        getInlineNativeAdHTML(
                            adContainerId
                        );


                    container.appendChild(
                        wrapper
                    );


                    setTimeout(
                        () => {

                            loadNativeAdForElement(
                                adContainerId
                            );

                        },
                        500
                    );

                }

            }

        }
    );


    updateLoaderUI();


    setTimeout(
        () => {

            updateNativeAdPosition();

        },
        300
    );

}


/* =========================================================
   INTERSECTION OBSERVER
========================================================= */

function setupIntersectionObserver() {

    const loaderBox =
        document.getElementById(
            "feedLoaderBox"
        );


    if (!loaderBox) {
        return;
    }


    const observer =
        new IntersectionObserver(

            entries => {

                entries.forEach(
                    entry => {

                        if (

                            entry.isIntersecting &&

                            !document
                                .getElementById(
                                    "searchModalOverlay"
                                )
                                .classList
                                .contains(
                                    "active-search"
                                )

                        ) {

                            executeLoadMoreBatch();

                        }

                    }
                );

            },

            {

                root: null,

                rootMargin:
                    "400px",

                threshold:
                    0

            }

        );


    observer.observe(
        loaderBox
    );

}


/* =========================================================
   LOAD MORE
========================================================= */

function executeLoadMoreBatch() {

    if (
        isFetchingMore
    ) {

        return;

    }


    const filtered =
        localCachedBroadcasts.filter(

            item =>

                (
                    item.category ||
                    ""
                )
                .trim()
                .toLowerCase()
                ===
                currentActiveCategoryFilter
                    .trim()
                    .toLowerCase()

        );


    if (

        currentVisibleFeedCount >=
        filtered.length

    ) {

        return;

    }


    isFetchingMore =
        true;


    const loaderSpinner =
        document.getElementById(
            "loaderSpinner"
        );


    const loaderText =
        document.getElementById(
            "loaderText"
        );


    if (loaderSpinner) {

        loaderSpinner.style.display =
            "inline-block";

    }


    if (loaderText) {

        loaderText.innerText =
            "Loading...";

    }


    setTimeout(
        () => {

            renderFilteredBroadcasts(
                false
            );

            isFetchingMore =
                false;

        },
        300
    );

}


/* =========================================================
   LOADER UI
========================================================= */

function updateLoaderUI() {

    const loaderBox =
        document.getElementById(
            "feedLoaderBox"
        );

    const loaderSpinner =
        document.getElementById(
            "loaderSpinner"
        );

    const loaderText =
        document.getElementById(
            "loaderText"
        );


    if (!loaderBox) {
        return;
    }


    const filtered =
        localCachedBroadcasts.filter(

            item =>

                (
                    item.category ||
                    ""
                )
                .trim()
                .toLowerCase()
                ===
                currentActiveCategoryFilter
                    .trim()
                    .toLowerCase()

        );


    loaderBox.style.display =
        "block";


    if (

        currentVisibleFeedCount >=
        filtered.length

    ) {

        if (
            filtered.length > 0
        ) {

            if (loaderSpinner) {

                loaderSpinner.style.display =
                    "none";

            }


            if (loaderText) {

                loaderText.innerText =
                    "All updates loaded ✅";

            }

        } else {

            loaderBox.style.display =
                "none";

        }

    } else {

        if (loaderSpinner) {

            loaderSpinner.style.display =
                "none";

        }


        if (loaderText) {

            loaderText.innerText =
                "Loading...";

        }

    }

}


/* =========================================================
   BOTTOM NAV
========================================================= */

function adjustBottomNavigationOffsets() {

    const nav =
        document.getElementById(
            "mainBottomNav"
        );


    if (!nav) {
        return;
    }


    const navHeight =
        nav.offsetHeight || 65;


    document.documentElement
        .style
        .setProperty(
            "--bottom-nav-height",
            `${navHeight}px`
        );


    const mainArea =
        document.getElementById(
            "mainContentArea"
        );


    if (mainArea) {

        mainArea.style.paddingBottom =
            `${navHeight + 90}px`;

    }

}


/* =========================================================
   SEARCH CONTROLS
========================================================= */

function setupSearchEngineControls() {

    const openBtn =
        document.getElementById(
            "openSearchBtn"
        );

    const closeBtn =
        document.getElementById(
            "closeSearchDrawerBtn"
        );

    const searchOverlay =
        document.getElementById(
            "searchModalOverlay"
        );

    const searchInput =
        document.getElementById(
            "newsCodeSearchInput"
        );


    if (openBtn) {

        openBtn.addEventListener(
            "click",
            () => {

                searchOverlay
                    .classList
                    .add(
                        "active-search"
                    );


                if (searchInput) {

                    searchInput.value =
                        "";

                    searchInput.focus();

                    executeNewsSearchQuery(
                        ""
                    );

                }

            }
        );

    }


    if (closeBtn) {

        closeBtn.addEventListener(
            "click",
            () => {

                searchOverlay
                    .classList
                    .remove(
                        "active-search"
                    );

            }
        );

    }


    if (searchInput) {

        searchInput.addEventListener(
            "input",
            event => {

                executeNewsSearchQuery(
                    event.target.value
                );

            }
        );

    }

}


/* =========================================================
   SEARCH
========================================================= */

function executeNewsSearchQuery(
    query
) {

    const resultsArea =
        document.getElementById(
            "searchResultsArea"
        );


    if (!resultsArea) {
        return;
    }


    const cleanQuery =
        query
            .trim()
            .toLowerCase();


    if (!cleanQuery) {

        resultsArea.innerHTML = `

            <div
                style="
                    text-align:center;
                    padding:30px 20px;
                    color:#ffffff;
                    font-size:13px;
                    font-weight:600;
                ">

                Type any word or code above
                to search all posts.

            </div>

        `;

        return;

    }


    const matchedNews =
        localCachedBroadcasts.filter(
            item => {

                const code =

                    String(
                        item.newsCode ||
                        item.code ||
                        item.id ||
                        ""
                    )
                    .toLowerCase();


                const title =

                    String(
                        item.title ||
                        item.newsTitle ||
                        ""
                    )
                    .toLowerCase();


                const content =

                    String(
                        item.content ||
                        item.message ||
                        ""
                    )
                    .toLowerCase();


                const cat =

                    String(
                        item.category ||
                        ""
                    )
                    .toLowerCase();


                return (

                    code.includes(
                        cleanQuery
                    ) ||

                    title.includes(
                        cleanQuery
                    ) ||

                    content.includes(
                        cleanQuery
                    ) ||

                    cat.includes(
                        cleanQuery
                    )

                );

            }
        );


    if (
        matchedNews.length === 0
    ) {

        resultsArea.innerHTML = `

            <div
                style="
                    text-align:center;
                    padding:30px 20px;
                    color:#ffffff;
                    font-size:13px;
                    font-weight:600;
                ">

                No updates matching
                "<strong>${escapeHTML(
                    cleanQuery
                )}</strong>"
                found.

            </div>

        `;

        return;

    }


    resultsArea.innerHTML =
        "";


    matchedNews.forEach(
        item => {

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "featured-broadcast-card";


            card.innerHTML =
                buildSingleNewsCardHTML(
                    item
                );


            resultsArea.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   FILTER BUTTONS
========================================================= */

function bindVisualInterfaceControls() {

    document
        .querySelectorAll(
            ".filter-btn"
        )
        .forEach(
            pill => {

                pill.addEventListener(
                    "click",
                    function () {

                        document
                            .querySelectorAll(
                                ".filter-btn"
                            )
                            .forEach(
                                p => {

                                    p.classList
                                        .remove(
                                            "active-pill",
                                            "active"
                                        );

                                }
                            );


                        this.classList.add(
                            "active-pill",
                            "active"
                        );


                        currentActiveCategoryFilter =

                            this.getAttribute(
                                "data-filter"
                            ) ||

                            "Shikela Update";


                        renderFilteredBroadcasts(
                            true
                        );


                        setTimeout(
                            () => {

                                loadVisibleNativeAd();

                            },
                            700
                        );

                    }
                );

            }
        );

}
