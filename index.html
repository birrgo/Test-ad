/* =========================================================
   MENU DRAWER
========================================================= */

.menu-iframe-overlay {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: rgba(0,0,0,0.5);

    z-index: 9999;

    opacity: 0;

    visibility: hidden;

    transition:
        opacity 0.3s ease,
        visibility 0.3s ease;
}


.menu-iframe-overlay.active {

    opacity: 1;

    visibility: visible;
}


.menu-iframe-drawer {

    position: absolute;

    top: 0;
    left: 0;

    width: 75%;
    height: 100%;

    border: none;

    background: #081B38;

    transform:
        translateX(-100%);

    transition:
        transform 0.3s ease-in-out;

    box-shadow:
        4px 0 12px rgba(0,0,0,0.3);
}


.menu-iframe-overlay.active
.menu-iframe-drawer {

    transform:
        translateX(0);
}


/* =========================================================
   GLOBAL
========================================================= */

body {

}

}


.ad-badge {

.web-ad-text {

}


/* =========================================================
   REAL NATIVE ADMOB IN-FEED AD
========================================================= */

/*
   IMPORTANT:

   This element is NOT the advertisement itself.

   Android NativeAdMobPlugin.java creates the real
   Google Mobile Ads NativeAdView above this location.
*/

.inline-feed-ad-slot {

    position: relative;

    width: 100%;

    height: 250px;

    min-height: 250px;

    margin:
        12px 0;

    background:
        transparent;

    border: 0;

    overflow: visible;

    box-sizing: border-box;

}


/*
   Invisible positioning target.

   Android native ad is displayed over this location.
*/

.native-ad-placeholder {

    width: 100%;

    height: 250px;

    visibility: hidden;

}


/*
   Do not show native slot on normal website.
*/

body.web-version

/* =========================================================
   FEED LOADER
========================================================= */

.feed-loader-box {

    text-align: center;

    font-size: 14px;

.loader-spinner {

    border-radius: 50%;

    animation:

    vertical-align: middle;

    margin-right: 8px;

/* =========================================================

========================================================= */

/* =========================================================

<script type="module">


/* =========================================================
   FIREBASE IMPORT
========================================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


import {
    getDatabase,
    ref,
    onValue
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyCqwgwiukwKb7o6gwnaLoPQSWc7bFmdYQ",

    authDomain:
        "besuad.firebaseapp.com",

    databaseURL:
        "https://besuad-default-rtdb.firebaseio.com",

    projectId:
        "besuad",

    storageBucket:
        "besuad.firebasestorage.app",

    messagingSenderId:
        "641705823615",

    appId:
        "1:641705823615:web:6502b2511ff8c0f251de4a",

    measurementId:
        "G-2YSX71N08Q"

};


const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getDatabase(
        app
    );


const APP_NODE_NAME =
    "app1";


/* =========================================================
   DATA
========================================================= */

let rawShikelaNewsData = {};

let rawNewNewsData = {};

let localCachedBroadcasts = [];

let currentActiveCategoryFilter =
    "Shikela Update";


/* =========================================================
   ADS
========================================================= */

let isBannerInitialized =
    false;

let articleClickCount =
    0;


/*
 * Google official test IDs
 */

const TEST_BANNER_ID =
    "ca-app-pub-3940256099942544/6300978111";

const TEST_INTERSTITIAL_ID =
    "ca-app-pub-3940256099942544/1033173712";

const TEST_NATIVE_ID =
    "ca-app-pub-3940256099942544/2247696110";


window.globalAdConfig = {

    status: false,

    bannerId:
        TEST_BANNER_ID,

    interstitialId:
        TEST_INTERSTITIAL_ID,

    nativeId:
        TEST_NATIVE_ID,

    interstitialInterval:
        3,

    placements: {},

    isTesting:
        true

};


/* =========================================================
   FEED
========================================================= */

let currentVisibleFeedCount =
    0;

let isFetchingMore =
    false;

const FEED_BATCH_SIZE =
    3;


/*
 * Only ONE native ad view is used by
 * NativeAdMobPlugin.java.
 *
 * This ID tracks the current target.
 */

let currentNativeAdElementId =
    null;


/* =========================================================
   INITIALIZE
========================================================= */

function initApp() {

    adjustBottomNavigationOffsets();

    detectPlatform();

    fetchDatabaseAdConfig();

    streamLiveAdminUpdatesLog();

    bindVisualInterfaceControls();

    setupSearchEngineControls();

    setupIntersectionObserver();

}


if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        initApp
    );

} else {

    initApp();

}


/* =========================================================
   PAGE SHOW
========================================================= */

window.addEventListener(
    "pageshow",
    (event) => {

        if (
            event.persisted &&
            window.globalAdConfig.status
        ) {

            setTimeout(
                () => {

                    triggerBannerAd();

                },
                300
            );

        }

    }
);


/* =========================================================
   PLATFORM
========================================================= */

function isNativeApp() {

    return Boolean(

        window.Capacitor &&

        typeof
            window.Capacitor
                .isNativePlatform
            === "function" &&

        window.Capacitor
            .isNativePlatform()

    );

}


function detectPlatform() {

    if (
        isNativeApp()
    ) {

        document.body
            .classList
            .remove(
                "web-version"
            );

    } else {

        document.body
            .classList
            .add(
                "web-version"
            );

    }

}


/* =========================================================
   GET ADMOB
========================================================= */

function getAdMobPlugin() {

    if (
        !isNativeApp()
    ) {

        return null;

    }


    return (

        window.Capacitor &&
        window.Capacitor.Plugins &&
        window.Capacitor.Plugins.AdMob

    )
        ? window.Capacitor
            .Plugins
            .AdMob
        : null;

}


/* =========================================================
   GET NATIVE ADMOB PLUGIN
========================================================= */

function getNativeAdMobPlugin() {

    if (
        !isNativeApp()
    ) {

        return null;

    }


    return (

        window.Capacitor &&
        window.Capacitor.Plugins &&
        window.Capacitor.Plugins.NativeAdMob

    )
        ? window.Capacitor
            .Plugins
            .NativeAdMob
        : null;

}


/* =========================================================
   INTERSECTION OBSERVER
========================================================= */

function setupIntersectionObserver() {

    const loaderBox =
        document.getElementById(
            "feedLoaderBox"
        );


    if (!loaderBox) {
        return;
    }


    const options = {

        root: null,

        rootMargin: "400px",

        threshold: 0

    };


    const observer =
        new IntersectionObserver(

            (entries) => {

                entries.forEach(
                    (entry) => {

                        if (

                            entry.isIntersecting &&

                            !document
                                .getElementById(
                                    "searchModalOverlay"
                                )
                                .classList
                                .contains(
                                    "active-search"
                                )

                        ) {

                            executeLoadMoreBatch();

                        }

                    }
                );

            },

            options

        );


    observer.observe(
        loaderBox
    );

}


/* =========================================================
   LOAD MORE
========================================================= */

function executeLoadMoreBatch() {

    if (
        isFetchingMore
    ) {

        return;

    }


    const filtered =
        localCachedBroadcasts.filter(

            item =>

                (
                    item.category ||
                    ""
                )
                .trim()
                .toLowerCase()
                ===
                currentActiveCategoryFilter
                    .trim()
                    .toLowerCase()

        );


    if (

        currentVisibleFeedCount
        >=
        filtered.length

    ) {

        return;

    }


    isFetchingMore =
        true;


    const loaderSpinner =
        document.getElementById(
            "loaderSpinner"
        );


    const loaderText =
        document.getElementById(
            "loaderText"
        );


    if (loaderSpinner) {

        loaderSpinner.style.display =
            "inline-block";

    }


    if (loaderText) {

        loaderText.innerText =
            "Loading...";

    }


    setTimeout(
        () => {

            renderFilteredBroadcasts(
                false
            );

            isFetchingMore =
                false;

        },
        300
    );

}


/* =========================================================
   LOADER
========================================================= */

function updateLoaderUI() {

    const loaderBox =
        document.getElementById(
            "feedLoaderBox"
        );


    const loaderSpinner =
        document.getElementById(
            "loaderSpinner"
        );


    const loaderText =
        document.getElementById(
            "loaderText"
        );


    if (!loaderBox) {
        return;
    }


    const filtered =
        localCachedBroadcasts.filter(

            item =>

                (
                    item.category ||
                    ""
                )
                .trim()
                .toLowerCase()
                ===
                currentActiveCategoryFilter
                    .trim()
                    .toLowerCase()

        );


    loaderBox.style.display =
        "block";


    if (

        currentVisibleFeedCount
        >=
        filtered.length

    ) {

        if (
            filtered.length > 0
        ) {

            if (loaderSpinner) {

                loaderSpinner.style.display =
                    "none";

            }


            if (loaderText) {

                loaderText.innerText =

                        TEST_INTERSTITIAL_ID,

            const isStatusOn =

                adData.adStatus === true ||

                adData.adStatus === "true" ||

                adData.adStatus === 1;


            const bannerId =
                (
                    adData.adMobBannerUnitId ||
                    TEST_BANNER_ID
                ).trim();


            const interstitialId =
                (

                    TEST_INTERSTITIAL_ID
                ).trim();


            const nativeId =
                (
                    adData.adMobNativeUnitId ||
                    TEST_NATIVE_ID
                ).trim();


            window.globalAdConfig = {

                status:
                    isStatusOn,

                bannerId:
                    bannerId,

                interstitialId:
                    interstitialId,

                nativeId:
                    nativeId,

                interstitialInterval:

                    parseInt(
                        adData.interstitialAdInterval,
                        10
                    ) || 3,

                placements:
                    adData.placements || {},

                isTesting:

                    bannerId.includes(
                        "3940256099942544"
                    ) ||

                    nativeId.includes(
                        "3940256099942544"
                    )

            };


            /*
             * NATIVE APP
             */

            if (
                isNativeApp()
            ) {

                initializeNativeAdMob();

            }

            /*
             * WEBSITE
             */

            else {

                triggerBannerAd();

            }


            if (
                localCachedBroadcasts.length > 0
            ) {

                renderFilteredBroadcasts(
                    true
                );

            }

        }
    );

/* =========================================================
   INITIALIZE ADMOB
========================================================= */

async function initializeNativeAdMob() {

    const AdMob =
        getAdMobPlugin();


    if (!AdMob) {

        console.warn(
            "Capacitor AdMob plugin not found."
        );

        return;

    }


    /*
     * ADS OFF
     */

    if (
        !window.globalAdConfig.status
    ) {

        try {

            await AdMob.hideBanner()
                .catch(
                    () => {}
                );


            await AdMob.removeBanner()
                .catch(
                    () => {}
                );

        } catch (e) {}


        const NativeAdMob =
            getNativeAdMobPlugin();


        if (NativeAdMob) {

            await NativeAdMob.hide()
                .catch(
                    () => {}
                );

        }


        return;

    }


    try {


        /*
         * Initialize Google Mobile Ads
         */

        await AdMob.initialize({

            requestTrackingAuthorization:
                true,

            initializeForTesting:
                window.globalAdConfig
                    .isTesting

        });


        /*
         * Prepare interstitial
         */

        if (
            window.globalAdConfig
                .interstitialId
        ) {

            await AdMob
                .prepareInterstitial({

                    adId:
                        window.globalAdConfig
                            .interstitialId,

                    isTesting:
                        window.globalAdConfig
                            .isTesting

                })
                .catch(
                    error => {

                        console.warn(
                            "Interstitial prepare:",
                            error
                        );

                    }
                );

        }


        /*
         * Bottom banner
         */

        setTimeout(
            () => {

                triggerBannerAd();

            },
            500
        );


        /*
         * Native feed ad
         */

        setTimeout(
            () => {

                loadVisibleNativeAd();

            },
            1000
        );


    } catch (error) {

        console.error(
            "AdMob initialization error:",
            error
        );

    }

}

async function triggerBannerAd() {

        );

                .placements
                ?.bannerAdHomePage
                !== false
        ) &&

        Boolean(
            window.globalAdConfig
                .bannerId
        );


    /*
     * ADS OFF
     */

        !shouldShowBanner
    ) {

        if (adWrapper) {

            adWrapper.style.display =
                "none";

        }


        if (
            isNativeApp()
        ) {

            const AdMob =
                getAdMobPlugin();


            if (AdMob) {

                await AdMob.hideBanner()
                    .catch(
                        () => {}
                    );

            }

        }


        return;

    }


    /*

     * NATIVE ANDROID / IOS
     * =====================================================
     */

        isNativeApp()
    ) {

        const AdMob =
            getAdMobPlugin();


        if (!AdMob) {

            console.warn(
                "AdMob plugin unavailable."
            );

            await AdMob.showBanner({

/* =========================================================
   LOAD REAL NATIVE ADMOB
========================================================= */

async function loadNativeAdForElement(
    elementId
) {

    if (
        !isNativeApp()
    ) {

        return;

    }


    if (
        !window.globalAdConfig.status
    ) {

        return;

    }


    const NativeAdMob =
        getNativeAdMobPlugin();


    if (!NativeAdMob) {

        console.warn(
            "NativeAdMob plugin not installed."
        );

        return;

    }


    const element =
        document.getElementById(
            elementId
        );


    if (!element) {

        return;

    }


    currentNativeAdElementId =
        elementId;


    const rect =
        element.getBoundingClientRect();


    /*
     * Convert browser coordinates to
     * WebView coordinates.
     */

    const visible =

        rect.bottom > 0 &&

        rect.top < window.innerHeight;


    if (!visible) {

        return;

    }


    const adUnitId =
        (
            window.globalAdConfig
                .nativeId ||
            TEST_NATIVE_ID
        ).trim();


    try {

        await NativeAdMob.show({

            adId:
                adUnitId,

            x:
                Math.round(
                    rect.left
                ),

            y:
                Math.round(
                    rect.top
                ),

            width:
                Math.round(
                    rect.width
                ),

            height:
                250

        });


        console.log(
            "REAL Native AdMob loaded:",
            adUnitId
        );


    } catch (error) {

        console.error(
            "Native AdMob error:",
            error
        );

    }

}


/* =========================================================
   FIND VISIBLE NATIVE AD
========================================================= */

function loadVisibleNativeAd() {

    if (
        !isNativeApp()
    ) {

        return;

    }


    const slots =
        document.querySelectorAll(
            ".inline-feed-ad-slot"
        );


    if (
        slots.length === 0
    ) {

        return;

    }


    let selectedSlot =
        null;


    /*
     * Select the first visible
     * native ad target.
     */

    for (
        const slot of slots
    ) {

        const rect =
            slot.getBoundingClientRect();


        if (

            rect.bottom > 0 &&

            rect.top <
                window.innerHeight

        ) {

            selectedSlot =
                slot;

            break;

        }

    }


    /*
     * If nothing visible,
     * use first slot.
     */

    if (!selectedSlot) {

        selectedSlot =
            slots[0];

    }


    if (!selectedSlot) {

        return;

    }


    if (

        currentNativeAdElementId
        ===
        selectedSlot.id

    ) {

        updateNativeAdPosition();

        return;

    }


    loadNativeAdForElement(
        selectedSlot.id
    );

}


/* =========================================================
   UPDATE NATIVE AD POSITION
========================================================= */

let nativeAdPositionFrame =
    null;


function updateNativeAdPosition() {

    if (
        !isNativeApp()
    ) {

        return;

    }


    const NativeAdMob =
        getNativeAdMobPlugin();


    if (!NativeAdMob) {

        return;

    }


    if (
        nativeAdPositionFrame
    ) {

        return;

    }


    nativeAdPositionFrame =
        requestAnimationFrame(
            async () => {

                nativeAdPositionFrame =
                    null;


                /*
                 * Find the currently active
                 * native target.
                 */

                if (
                    !currentNativeAdElementId
                ) {

                    loadVisibleNativeAd();

                    return;

                }


                const element =
                    document.getElementById(
                        currentNativeAdElementId
                    );


                if (!element) {

                    currentNativeAdElementId =
                        null;

                    loadVisibleNativeAd();

                    return;

                }


                const rect =
                    element.getBoundingClientRect();


                const visible =

                    rect.bottom > 0 &&

                    rect.top <
                        window.innerHeight;


                try {

                    if (!visible) {

                        /*
                         * Try another visible
                         * native target.
                         */

                        loadVisibleNativeAd();

                        return;

                    }


                    await NativeAdMob
                        .setPosition({

                            x:
                                Math.round(
                                    rect.left
                                ),

                            y:
                                Math.round(
                                    rect.top
                                ),

                            width:
                                Math.round(
                                    rect.width
                                ),

                            height:
                                250

                        });


                } catch (error) {

                    console.warn(
                        "Native ad position:",
                        error
                    );

                }

            }
        );

}

window.navigateToFull =
    async function (
        itemId,
        nodeName
    ) {

        articleClickCount++;


        const targetUrl =

            `full.html?id=${
                encodeURIComponent(
                    itemId
                )
            }&node=${
                encodeURIComponent(
                    nodeName ||
                    "shikelaNews"
                )
            }`;


        /*
         * Native AdMob
         */

        if (

            isNativeApp() &&

            window.globalAdConfig.status

        ) {

            const AdMob =
                getAdMobPlugin();


            if (AdMob) {

                const interval =
                    Math.max(

                        1,

                        Number(
                            window.globalAdConfig
                                .interstitialInterval
                        ) || 3

                    );


                /*
                 * Show interstitial every N clicks
                 */

                if (

                    articleClickCount %
                        interval
                    ===
                    0 &&

                    window.globalAdConfig
                        .interstitialId

                ) {

                    try {

                        await AdMob
                            .showInterstitial();


                        await AdMob
                            .prepareInterstitial({

                                adId:
                                    window.globalAdConfig
                                        .interstitialId,

                                isTesting:
                                    window.globalAdConfig
                                        .isTesting

                            });


                    } catch (error) {

                        console.warn(
                            "Interstitial skipped:",
                            error
                        );

                    }

                }


                /*
                 * Remove bottom banner
                 */

                try {

                    await AdMob
                        .hideBanner()
                        .catch(
                            () => {}
                        );


                    await AdMob
                        .removeBanner()
                        .catch(
                            () => {}
                        );


                    isBannerInitialized =
                        false;

                } catch (error) {

                    console.warn(
                        "Banner cleanup:",
                        error
                    );

                }


                /*
                 * Remove native feed ad
                 */

                const NativeAdMob =
                    getNativeAdMobPlugin();


                if (NativeAdMob) {

                    await NativeAdMob
                        .destroy()
                        .catch(
                            () => {}
                        );

                }

            }

        }


        window.location.href =
            targetUrl;

    };


/* =========================================================
   TIMESTAMP
========================================================= */

function extractValidTimestamp(
    item
) {

    const raw =

        item.timestamp ||

        item.updatedAt ||

        item.createdAtTimestamp ||

        item.createdAt ||

        item.date;


    if (

        typeof raw === "number" &&

        !isNaN(raw)

    ) {

        return raw;

    }


    if (
        typeof raw === "string"
    ) {

        const parsed =
            parseInt(
                raw,
                10
            );


        if (

            !isNaN(parsed) &&

            parsed >
                1000000000

        ) {

            return parsed <
                100000000000

                ? parsed * 1000

                : parsed;

        }


        const dateParsed =
            new Date(
                raw
            ).getTime();


        if (
            !isNaN(dateParsed)
        ) {

            return dateParsed;

        }

    }


    return Date.now();

}

function rebuildAndRenderBroadcastsCache() {

    localCachedBroadcasts =
        [];


    const addNode =
        (

            defaultCat,
            nodeName
        ) => {


            Object.keys(
                dataObj
            )
            .forEach(
                key => {

                    const item =
                        dataObj[key];


                    if (

                        typeof item ===
                            "object" &&

                        item !== null

                    ) {

                        localCachedBroadcasts
                            .push({

                                id:
                                    key,

                                sourceNode:
                                    nodeName,

                                ...item,

                                title:
                                    item.title ||
                                    item.newsTitle ||
                                    defaultCat,

                                category:
                                    item.category ||
                                    defaultCat,

                                resolvedTimestamp:
                                    extractValidTimestamp(
                                        item
                                    )

                            });

                    }

                }
            );

        };


    addNode(
        rawShikelaNewsData,
        "Shikela Update",
        "shikelaNews"
    );


    addNode(
        rawNewNewsData,
        "Shikela Tips",
        "newNews"
    );


    localCachedBroadcasts.sort(
        (a,b) =>

            b.resolvedTimestamp -
            a.resolvedTimestamp

    );


    renderFilteredBroadcasts(
        true
    );

}

/* =========================================================
   SECURITY
========================================================= */

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /[&<>"']/g,
        char =>

            ({

                "&":
                    "&amp;",

                "<":
                    "&lt;",

                ">":
                    "&gt;",

                '"':
                    "&quot;",

                "'":
                    "&#039;"

            })[char]

    );

}


function escapeJS(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /\r?\n/g,
        "\\n"
    );

}


/* =========================================================
   RENDER FEED
========================================================= */

function renderFilteredBroadcasts(
    reset = false
) {

    const container =
        document.getElementById(
            "broadcastsContainer"
        );


    if (!container) {
        return;
    }


    const filtered =
        localCachedBroadcasts.filter(

            item =>

                (
                    item.category ||
                    ""
                )
                .trim()
                .toLowerCase()
                ===
                currentActiveCategoryFilter
                    .trim()
                    .toLowerCase()

        );


    if (reset) {

        container.innerHTML =
            "";

        currentVisibleFeedCount =
            0;

        currentNativeAdElementId =
            null;

    }


    if (
        filtered.length === 0
    ) {

        if (reset) {

            container.innerHTML = `

                <article
                    class="featured-broadcast-card">

                    <h2
                        class="broadcast-title">

                        No updates posted today.

                    </h2>

                </article>

            `;

        }


        updateLoaderUI();

        return;

    }


    const nextBatch =
        filtered.slice(

            currentVisibleFeedCount,

            currentVisibleFeedCount +
                FEED_BATCH_SIZE

        );


    if (
        nextBatch.length === 0
    ) {

        updateLoaderUI();

        return;

    }


    nextBatch.forEach(
        item => {


            /*
             * NEWS CARD
             */

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "featured-broadcast-card";


            card.innerHTML =
                buildSingleNewsCardHTML(
                    item
                );


            container.appendChild(
                card
            );


            currentVisibleFeedCount++;


            /*
             * =================================================
             * REAL NATIVE ADMOB
             *
             * Insert ONE native ad target after the
             * second article.
             *
             * NativeAdMobPlugin.java renders the real
             * Google NativeAdView above this location.
             * =================================================
             */

            if (

                currentVisibleFeedCount ===
                2 &&

                window.globalAdConfig.status &&

                isNativeApp() &&

                window.globalAdConfig
                    .placements
                    ?.nativeAdPostList
                    !== false

            ) {


                const adContainerId =

                    "native-ad-feed";


                const existingAd =
                    document.getElementById(
                        adContainerId
                    );


                if (!existingAd) {

                    const inlineAdWrapper =
                        document.createElement(
                            "div"
                        );


                    inlineAdWrapper.innerHTML =
                        getInlineNativeAdHTML(
                            adContainerId
                        );


                    container.appendChild(
                        inlineAdWrapper
                    );


                    setTimeout(
                        () => {

                            loadNativeAdForElement(
                                adContainerId
                            );

                        },
                        500
                    );

                }

            }

        }
    );


    updateLoaderUI();


    setTimeout(
        () => {

            updateNativeAdPosition();

        },
        300
    );

}

function executeNewsSearchQuery(
    query
) {

    const resultsArea =
        document.getElementById(
            "searchResultsArea"
        );


    if (!resultsArea) {
        return;
    }


    const cleanQuery =
        query
            .trim()
            .toLowerCase();


    if (!cleanQuery) {

        resultsArea.innerHTML = `

            <div
                style="
                    text-align:center;
                    padding:30px 20px;
                    color:#ffffff;
                    font-size:13px;
                    font-weight:600;
                ">

                Type any word or code above
                to search all posts.

            </div>

        `;

        return;

    }


    const matchedNews =
        localCachedBroadcasts.filter(
            item => {


                const code =

                    String(
                        item.newsCode ||
                        item.code ||
                        item.id ||
                        ""
                    )
                    .toLowerCase();


                const title =

                    String(
                        item.title ||
                        item.newsTitle ||
                        ""
                    )
                    .toLowerCase();


                const content =

                    String(
                        item.content ||
                        item.message ||
                        ""
                    )
                    .toLowerCase();


                const cat =

                    String(
                        item.category ||
                        ""
                    )
                    .toLowerCase();


                return (

                    code.includes(
                        cleanQuery
                    ) ||

                    title.includes(
                        cleanQuery
                    ) ||

                    content.includes(
                        cleanQuery
                    ) ||

                    cat.includes(
                        cleanQuery
                    )

                );

            }
        );


    if (
        matchedNews.length === 0
    ) {

        resultsArea.innerHTML = `

            <div
                style="
                    text-align:center;
                    padding:30px 20px;
                    color:#ffffff;
                    font-size:13px;
                    font-weight:600;
                ">

                No updates matching
                "<strong>${
                    escapeHTML(
                        cleanQuery
                    )
                }</strong>"
                found.

            </div>

        `;

        return;

    }


    resultsArea.innerHTML =
        "";


    matchedNews.forEach(
        item => {

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "featured-broadcast-card";


            card.innerHTML =
                buildSingleNewsCardHTML(
                    item
                );


            resultsArea.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   FILTER BUTTONS
========================================================= */

function bindVisualInterfaceControls() {

    document
        .querySelectorAll(
            ".filter-btn"
        )
        .forEach(
            pill => {

                pill.addEventListener(
                    "click",
                    function () {


                        document
                            .querySelectorAll(
                                ".filter-btn"
                            )
                            .forEach(
                                p =>

                                    p.classList
                                        .remove(
                                            "active-pill",
                                            "active"
                                        )
                            );


                        this.classList.add(
                            "active-pill",
                            "active"
                        );


                        currentActiveCategoryFilter =

                            this.getAttribute(
                                "data-filter"
                            ) ||

                            "Shikela Update";


                        renderFilteredBroadcasts(
                            true
                        );


                        /*
                         * Load native ad again
                         * for the new feed.
                         */

                        setTimeout(
                            () => {

                                loadVisibleNativeAd();

                            },
                            700
                        );

                    }
                );

            }
        );

}

</script>


<!-- =========================================================
     MENU SCRIPT
========================================================= -->

<script>


const openBtn =
    document.getElementById(
        "openMenuIframeBtn"
    );


const overlay =
    document.getElementById(
        "menuIframeOverlay"
    );


const menuIframe =
    document.getElementById(
        "menuIframe"
    );


if (openBtn) {

    openBtn.addEventListener(
        "click",
        () => {

            menuIframe.src =
                "menu.html";

            overlay.classList.add(
                "active"
            );

        }
    );

}


if (overlay) {

    overlay.addEventListener(
        "click",
        e => {

            if (
                e.target === overlay
            ) {

                overlay.classList.remove(
                    "active"
                );

            }

        }
    );

}


</script>
