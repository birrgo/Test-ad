                </div>
            `;

        // ==========================================
        // Fetch AdMob Config & Initialize Placements
        // ==========================================
        function fetchAdMobUnits() {
            const adManagerRef = ref(db, `${APP_NODE_NAME}/adManager`);
            onValue(adManagerRef, (snapshot) => {
                if (snapshot.exists()) {
                    const adData = snapshot.val();
                    window.globalAdConfig = {
                        status: adData.adStatus,
                        primaryNetwork: adData.primaryAdNetwork,
                        bannerId: adData.adMobBannerUnitId,
                        interstitialId: adData.adMobInterstitialUnitId,
                        nativeId: adData.adMobNativeUnitId,
                        appOpenId: adData.adMobAppOpenUnitId,
                        placements: adData.placements || {}
                    };

                    if (window.Capacitor && window.Capacitor.isNativePlatform()) {
                        const { AdMob } = Capacitor.Plugins;
                        AdMob.initialize({
                            requestTrackingAuthorization: true,
                            initializeForTesting: false
                        }).then(() => {
                            triggerAppOpenAd();
                            triggerBannerAd();
                            if(localCachedBroadcasts.length > 0) renderFilteredBroadcasts();
                        });
                    } else {
                        triggerAppOpenAd();
                        triggerBannerAd();
                        if(localCachedBroadcasts.length > 0) renderFilteredBroadcasts();
                    }
                }
            });
        }

        // ==========================================
        // Fixed App Open Ad (Triggers on start & resume)
        // ==========================================
        async function triggerAppOpenAd() {
            if (window.globalAdConfig?.placements?.appOpenAdStart && window.globalAdConfig.appOpenId) {
                if (window.Capacitor && window.Capacitor.isNativePlatform()) {
                    const { AdMob, App } = Capacitor.Plugins;
                    
                    const showAd = async () => {
                        try {
                            await AdMob.prepareAppOpenAd({ adId: window.globalAdConfig.appOpenId });
                            await AdMob.showAppOpenAd();
                        } catch (e) { console.error("App Open Ad Error:", e); }
                    };

                    // Show on first initialization
                    if (!hasTriggeredAppOpen) {
                        hasTriggeredAppOpen = true;
                        showAd();
                    }

                    // Show whenever user returns to the app from the background
                    if (App) {
                        App.addListener('appStateChange', ({ isActive }) => {
                            if (isActive) showAd();
                        });
                    }
                }
            }
        }

        // ==========================================
        // Fixed Bottom Banner Ad Margin
        // ==========================================
        async function triggerBannerAd() {
            const adWrapper = document.getElementById('adContainerWrapper');
            if (window.globalAdConfig?.placements?.bannerAdHomePage && window.globalAdConfig.bannerId) {
                if (window.Capacitor && window.Capacitor.isNativePlatform()) {
                    const { AdMob } = Capacitor.Plugins;
                    try {
                        // Margin increased to 85 to sit above the navigation menu
                        await AdMob.showBanner({ adId: window.globalAdConfig.bannerId, position: 'BOTTOM_CENTER', margin: 85 });
                    } catch (e) { console.error(e); }
                } else {
                    adWrapper.style.display = 'flex';
                    document.getElementById('mainContentArea').style.paddingBottom = '145px';
                }
            } else {
                adWrapper.style.display = 'none';
            }
        }

        async function showInterstitialAdMock(onAdClosedCallback) {
            if (window.globalAdConfig?.placements?.interstitialAdPostDetails && window.globalAdConfig.interstitialId) {
                triggerUiPopup("⏳", "Loading Article", "Please wait while we load content...");
                document.getElementById('closePopupBtn').style.display = 'none';

                if (window.Capacitor && window.Capacitor.isNativePlatform()) {
                    const { AdMob } = Capacitor.Plugins;
                    try {
                        await AdMob.prepareInterstitial({ adId: window.globalAdConfig.interstitialId });
                        document.getElementById('customPopupModule').classList.remove('show-popup');
                        document.getElementById('closePopupBtn').style.display = 'block';
                        
                        await AdMob.showInterstitial();
                        onAdClosedCallback();
                    } catch (e) {
                        document.getElementById('customPopupModule').classList.remove('show-popup');
                        document.getElementById('closePopupBtn').style.display = 'block';
                        onAdClosedCallback(); 
                    }
                } else {
                    setTimeout(() => {
                        document.getElementById('customPopupModule').classList.remove('show-popup');
                        document.getElementById('closePopupBtn').style.display = 'block';
                        onAdClosedCallback();
                    }, 800);
                }
            } else {
                onAdClosedCallback(); 
            }
        }

        function getYouTubeEmbedUrl(url) {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = String(url).trim().match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}` : null;
        }

        function initiateLiveInterfaceClocks() {
            setInterval(() => {
                const cornerClockNode = document.getElementById('topCornerLiveClock');
                if (cornerClockNode) {
                    cornerClockNode.innerText = new Date().toLocaleTimeString(undefined, {
                        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
                    });
                }
                document.querySelectorAll('.timestamp-log-text[data-timestamp]').forEach(node => {
                    const rawTime = parseInt(node.getAttribute('data-timestamp'));
                    if (rawTime) node.innerText = formatExactTimestampWithSeconds(rawTime);
                });
            }, 1000);
        }

        function formatExactTimestampWithSeconds(baseEpoch) {
            const dateObj = new Date(baseEpoch);
            if (isNaN(dateObj.getTime())) return "Recent";
            return dateObj.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) + ' • ' + 
                   dateObj.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
        }

        function extractValidTimestamp(item) {
            const raw = item.timestamp || item.updatedAt || item.createdAtTimestamp || item.createdAt || item.date;
            if (typeof raw === 'number' && !isNaN(raw)) return raw;
            if (typeof raw === 'string') {
                const parsed = parseInt(raw, 10);
                if (!isNaN(parsed) && parsed > 1000000000) return parsed < 100000000000 ? parsed * 1000 : parsed;
                const dateParsed = new Date(raw).getTime();
                if (!isNaN(dateParsed)) return dateParsed;
            }
            return Date.now();
        }

        function rebuildAndRenderBroadcastsCache() {
            localCachedBroadcasts = [];
            const addNode = (dataObj, defaultCat) => {
                Object.keys(dataObj).forEach(key => {
                    const item = dataObj[key];
                    if (typeof item === 'object' && item !== null) {
                        localCachedBroadcasts.push({
                            id: key, ...item,
                            title: item.title || item.newsTitle || defaultCat,
                            category: item.category || defaultCat,
                            resolvedTimestamp: extractValidTimestamp(item)
                        });
                    }
                });
            };
            addNode(rawShikelaNewsData, "Shikela Update");
            addNode(rawNewNewsData, "Shikela Tips");
            localCachedBroadcasts.sort((a, b) => b.resolvedTimestamp - a.resolvedTimestamp);
            renderFilteredBroadcasts();
        }

        function streamLiveAdminUpdatesLog() {
            onValue(ref(db, `${APP_NODE_NAME}/shikelaNews`), (snapshot) => {
                rawShikelaNewsData = snapshot.exists() ? snapshot.val() : {};
                rebuildAndRenderBroadcastsCache();
            });
            onValue(ref(db, `${APP_NODE_NAME}/newNews`), (snapshot) => {
                rawNewNewsData = snapshot.exists() ? snapshot.val() : {};
                rebuildAndRenderBroadcastsCache();
            });
        }

        function buildSingleNewsCardHTML(item) {
            const headline = item.title || item.newsTitle || "Yala Tech Update";
            const fullContent = item.content || item.message || "";
            const displayCategory = (item.category || "Yala Tech Update").replace('Shikela', 'Yala Tech'); 
            const category = item.category || "Shikela Update";
            const imageUrl = item.imageUrl || item.image || "";

            const previewContent = fullContent.length > 120 ? fullContent.substring(0, 120).trim() + "..." : fullContent;
            const numericalTime = item.resolvedTimestamp || Date.now();
            const pillBadgeClass = category.toLowerCase().includes("tips") ? "spotlight-pill system-badge" : "spotlight-pill";

            let imageHTML = imageUrl ? `<div class="broadcast-image-frame" onclick="openFullNewsReader('${item.id}')"><img src="${imageUrl}" onload="this.classList.add('loaded')"></div>` : "";

            return `
                <div class="badge-meta-row">
                    <div style="display:flex; align-items:center; gap:6px;">
                        <span class="${pillBadgeClass}" style="text-transform: uppercase;">${displayCategory}</span>
                    </div>
                    <span class="timestamp-log-text" data-timestamp="${numericalTime}"></span>
                </div>
                ${imageHTML}
                <div class="clickable-news-content" onclick="openFullNewsReader('${item.id}')">
                    <h2 class="broadcast-title">${headline}</h2>
                    <p class="broadcast-body-text">${previewContent}</p>
                </div>
            `;
        }

        // ==========================================
        // Full Article Reader Controller
        // ==========================================
        window.openFullNewsReader = function(itemId) {
            if (isOpeningArticle) return;
            isOpeningArticle = true;
            
            showInterstitialAdMock(() => {
                executeOpenReader(itemId);
                isOpeningArticle = false;
            });
        };

        function executeOpenReader(itemId) {
            const item = localCachedBroadcasts.find(n => n.id === itemId);
            if (!item) return;

            const readerOverlay = document.getElementById('fullNewsModalOverlay');
            const readerBody = document.getElementById('fullNewsReaderBody');
            
            if (window.Capacitor && window.Capacitor.isNativePlatform()) {
                Capacitor.Plugins.AdMob.hideBanner().catch(e => console.log(e));
            } else {
                document.getElementById('adContainerWrapper').style.display = 'none';
            }

            const headline = item.title || item.newsTitle;
            const fullContent = item.content || item.message || "";
            const displayCategory = (item.category || "").replace('Shikela', 'Yala Tech');
            const imageUrl = item.imageUrl || item.image || "";
            const videoUrl = item.videoUrl || item.youtubeUrl || item.youtubeId || item.video || "";
            const targetRedirectUrl = item.link || item.redirectUrl || item.url || item.targetUrl || "";
            const customActionLabel = item.actionButtonLabel || item.actionLabel || "Visit External Source / Link";
            const pillBadgeClass = (item.category || "").toLowerCase().includes("tips") ? "spotlight-pill system-badge" : "spotlight-pill";

            let imageHTML = (imageUrl && Boolean(item.duplicateCoverInArticle ?? true)) 
                ? `<div class="reader-image-frame"><img src="${imageUrl.trim()}" alt="${headline}"></div>` : "";

            let videoHTML = "";
            const embedUrl = getYouTubeEmbedUrl(videoUrl);
            if (embedUrl) videoHTML = `<div class="reader-video-container"><iframe src="${embedUrl}" allowfullscreen></iframe></div>`;

            let redirectBtnHTML = targetRedirectUrl 
                ? `<div style="margin-top:20px;"><a href="${targetRedirectUrl}" target="_blank" class="redirect-link-btn" style="width:100%; justify-content:center;"><span>${customActionLabel}</span></a></div>` : "";

            let endOfArticleAd = "";
            
            if (window.globalAdConfig?.placements?.nativeAdPostDetails && window.globalAdConfig.nativeId) {
                endOfArticleAd = getNativeAdHTML(window.globalAdConfig.nativeId);
            } else if (window.globalAdConfig?.placements?.bannerAdPostDetails && window.globalAdConfig.bannerId) {
                endOfArticleAd = getWideBannerAdHTML(window.globalAdConfig.bannerId);
            }

            readerBody.innerHTML = `
                <div class="reader-meta-bar">
                    <span class="${pillBadgeClass}" style="text-transform: uppercase;">${displayCategory}</span>
                </div>
                <h1 class="reader-title">${headline}</h1>
                ${imageHTML}
                ${videoHTML}
                <div class="reader-full-body">${fullContent}</div>
                ${redirectBtnHTML}
                ${endOfArticleAd}
            `;
            readerOverlay.classList.add('active-reader');
        }

        function setupNewsReaderModalControls() {
            const closeBtn = document.getElementById('closeNewsReaderBtn');
            if (closeBtn) {
                closeBtn.addEventListener('click', () => {
                    document.getElementById('fullNewsModalOverlay').classList.remove('active-reader');
                    
                    if (window.Capacitor && window.Capacitor.isNativePlatform()) {
                        Capacitor.Plugins.AdMob.resumeBanner().catch(e => console.log(e));
                    } else {
                        if (window.globalAdConfig?.placements?.bannerAdHomePage) {
                            document.getElementById('adContainerWrapper').style.display = 'flex';
                        }
                    }
                });
            }
        }

        function renderFilteredBroadcasts() {
            const container = document.getElementById('broadcastsContainer');
            if (!container) return;
            container.innerHTML = "";

            const filtered = localCachedBroadcasts.filter(item => (item.category || "").trim().toLowerCase() === currentActiveCategoryFilter.trim().toLowerCase());
            
            if (filtered.length === 0) {
                container.innerHTML = `<article class="featured-broadcast-card"><h2 class="broadcast-title">No updates posted today.</h2></article>`;
                return;
            }

            let currentPostCount = 0;
            filtered.forEach((item) => {
                const card = document.createElement('article');
                card.className = "featured-broadcast-card";
                card.innerHTML = buildSingleNewsCardHTML(item);
                container.appendChild(card);
                
                currentPostCount++;

                if (currentPostCount % 2 === 0) {
                    if (window.globalAdConfig?.placements?.nativeAdPostList && window.globalAdConfig.nativeId) {
                        const nativeAdCard = document.createElement('article');
                        nativeAdCard.className = "featured-broadcast-card";
                        nativeAdCard.innerHTML = getNativeAdHTML(window.globalAdConfig.nativeId);
                        container.appendChild(nativeAdCard);
                    }
                }
            });
        }

        function setupSearchEngineControls() {
            const openBtn = document.getElementById('openSearchBtn');
            const closeBtn = document.getElementById('closeSearchDrawerBtn');
            const searchOverlay = document.getElementById('searchModalOverlay');
            const searchInput = document.getElementById('newsCodeSearchInput');

            if (openBtn) {
                openBtn.addEventListener('click', () => {
                    searchOverlay.classList.add('active-search');
                    if (searchInput) { searchInput.value = ''; searchInput.focus(); executeNewsSearchQuery(''); }
                });
            }
            if (closeBtn) {
                closeBtn.addEventListener('click', () => searchOverlay.classList.remove('active-search'));
            }
            if (searchInput) {
                searchInput.addEventListener('input', (e) => executeNewsSearchQuery(e.target.value));
            }
        }

        function executeNewsSearchQuery(query) {
            const resultsArea = document.getElementById('searchResultsArea');
            if (!resultsArea) return;

            const cleanQuery = query.trim().toLowerCase();
            if (!cleanQuery) {
                resultsArea.innerHTML = `<div style="text-align:center; padding:30px 20px; color:#ffffff; font-size:13px; font-weight:600;">Type any word or code above to search all posts.</div>`;
                return;
            }

            const matchedNews = localCachedBroadcasts.filter(item => {
                const code = String(item.newsCode || item.code || item.id || '').toLowerCase();
                const title = String(item.title || item.newsTitle || '').toLowerCase();
                const content = String(item.content || item.message || '').toLowerCase();
                const cat = String(item.category || '').toLowerCase();
                return code.includes(cleanQuery) || title.includes(cleanQuery) || content.includes(cleanQuery) || cat.includes(cleanQuery);
            });

            if (matchedNews.length === 0) {
                resultsArea.innerHTML = `<div style="text-align:center; padding:30px 20px; color:#ffffff; font-size:13px; font-weight:600;">No updates matching "<strong>${cleanQuery}</strong>" found.</div>`;
                return;
            }

            resultsArea.innerHTML = '';
            let searchResultCount = 0;
            
            matchedNews.forEach((item) => {
                const card = document.createElement('article');
                card.className = "featured-broadcast-card";
                card.innerHTML = buildSingleNewsCardHTML(item);
                resultsArea.appendChild(card);
                
                searchResultCount++;

                if (searchResultCount % 2 === 0) {
                    if (window.globalAdConfig?.placements?.nativeAdPostList && window.globalAdConfig.nativeId) {
                        const nativeAdCard = document.createElement('article');
                        nativeAdCard.className = "featured-broadcast-card";
                        nativeAdCard.innerHTML = getNativeAdHTML(window.globalAdConfig.nativeId);
                        resultsArea.appendChild(nativeAdCard);
                    }
                }
            });
        }

        function bindVisualInterfaceControls() {
            document.querySelectorAll('.filter-btn').forEach(pill => {
                pill.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(p => p.classList.remove('active-pill', 'active'));
                    this.classList.add('active-pill', 'active');
                    currentActiveCategoryFilter = this.getAttribute('data-filter') || "Shikela Update";
                    renderFilteredBroadcasts();
                });
            });
        }

        function triggerUiPopup(icon, title, desc) {
            const overlay = document.getElementById('customPopupModule');
            if (overlay) {
                document.getElementById('popupIconNode').innerText = icon;
                document.getElementById('popupTitleNode').innerText = title;
                document.getElementById('popupDescNode').innerText = desc;
                overlay.classList.add('show-popup');
            }
        }
    </script>

    <script>
        const openBtn = document.getElementById('openMenuIframeBtn');
        const overlay = document.getElementById('menuIframeOverlay');
        openBtn.addEventListener('click', () => { document.getElementById('menuIframe').src = 'menu.html'; overlay.classList.add('active'); });
        overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('active'); });
    </script>
</body>
</html>
