        // =========================================================================

        const REAL_PRODUCTION_ADMOB_CONFIG = {
            adStatus: true,
            primaryAdNetwork: "AdMob",
            bannerId: "ca-app-pub-6417058236150000/1000000001",
            interstitialId: "ca-app-pub-6417058236150000/2000000002",
            nativeId: "ca-app-pub-6417058236150000/3000000003",

                interstitialAdPostDetails: true,
                nativeAdPostList: true,
                nativeAdPostDetails: true,
                bannerAdPostDetails: true

        const firebaseConfig = {

            storageBucket: "besuad.firebasestorage.app",
            messagingSenderId: "641705823615",
            appId: "1:641705823615:web:6502b2511ff8c0f251de4a",
            measurementId: "G-2YSX71N08Q"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const APP_NODE_NAME = "app1"; 

        let rawShikelaNewsData = {};
        let rawNewNewsData = {};
        let localCachedBroadcasts = [];

        let cardClockIntervalId = null;

        let isOpeningArticle = false;

        window.globalAdConfig = {};

        const urlParams = new URLSearchParams(window.location.search);
        const isAdminMode = urlParams.get('admin') === 'true';

        document.addEventListener('DOMContentLoaded', () => {
            fetchAdMobUnits(); // Initialize and start AdMob system
            streamLiveAdminUpdatesLog();
            bindVisualInterfaceControls();
            setupSearchEngineControls();
            setupNewsReaderModalControls();

            const closeBtn = document.getElementById('closePopupBtn');
            if (closeBtn) {
                closeBtn.addEventListener('click', () => {
                    document.getElementById('customPopupModule').classList.remove('show-popup');
                });
            }
            initiateLiveInterfaceClocks();
        });

        function cleanAdId(id, fallback) {
            if (typeof id === 'string' && id.trim().length > 15 && !id.includes('3940256099942544')) {
                return id.trim();
            }
            return fallback;
        }

        // =========================================================================

                        <span style="font-size: 11px; color: #5f6368; font-weight: 700;">Featured</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 12px; margin-top: 8px;">
                        <div style="width: 48px; height: 48px; border-radius: 8px; background: #081B38; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="#ffffff"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg>

                            EXPLORE NOW
                        </a>
                    </div>
                </div>
            `;
        }

        // =========================================================================
        // AD 2: IN-ARTICLE WIDE BANNER AD (300x250)
        // =========================================================================
        function getWideBannerAdHTML(adUnitId) {
            const activeId = cleanAdId(adUnitId, REAL_PRODUCTION_ADMOB_CONFIG.bannerId);
            return `
                <div class="admob-real-native-card" data-ad-unit="${activeId}" style="width: 100%; max-width: 320px; min-height: 220px; margin: 25px auto; padding: 14px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; background: #f8fafc; border: 1px solid #cbd5e1;">
                    <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
                        <span class="admob-badge-label">Sponsored</span>
                        <span style="font-size: 11px; color: #5f6368; font-weight: 600;">Recommendation</span>
                    </div>
                    <div style="padding: 16px 0;">
                        <svg width="42" height="42" viewBox="0 0 24 24" fill="#081B38"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg>
                        <h4 style="font-size: 15px; color: #081B38; margin: 10px 0 4px 0; font-weight: 700;">Remote Careers & Vacancies</h4>
                        <p style="font-size: 12px; color: #64748b; margin: 0;">Connect directly with vetted online opportunities.</p>
                    </div>
                    <a href="https://shiqela.online/" target="_blank" style="display: block; width: 100%; box-sizing: border-box; text-align: center; text-decoration: none; background: #081B38; color: #ffffff; padding: 10px; border-radius: 6px; font-weight: 700; font-size: 13px; text-transform: uppercase;">
                        VISIT PORTAL
                    </a>
                </div>
            `;
        }

        // =========================================================================
        // READ AD CONFIG FROM FIREBASE RTDB & INITIALIZE ADMOB
        // =========================================================================
        function fetchAdMobUnits() {
            const adManagerRef = ref(db, `${APP_NODE_NAME}/adManager`);
            onValue(adManagerRef, (snapshot) => {
                const adData = snapshot.exists() ? snapshot.val() : {};

                window.globalAdConfig = {
                    status: (adData.adStatus !== undefined) ? (adData.adStatus === true || adData.adStatus === "true") : REAL_PRODUCTION_ADMOB_CONFIG.adStatus,
                    primaryNetwork: adData.primaryAdNetwork || REAL_PRODUCTION_ADMOB_CONFIG.primaryAdNetwork,
                    bannerId: cleanAdId(adData.adMobBannerUnitId, REAL_PRODUCTION_ADMOB_CONFIG.bannerId),
                    interstitialId: cleanAdId(adData.adMobInterstitialUnitId, REAL_PRODUCTION_ADMOB_CONFIG.interstitialId),
                    nativeId: cleanAdId(adData.adMobNativeUnitId, REAL_PRODUCTION_ADMOB_CONFIG.nativeId),
                    appOpenId: cleanAdId(adData.adMobAppOpenUnitId, REAL_PRODUCTION_ADMOB_CONFIG.appOpenId),
                    placements: {
                        ...REAL_PRODUCTION_ADMOB_CONFIG.placements,
                        ...(adData.placements || {})
                    }
                };

                if (window.Capacitor && window.Capacitor.isNativePlatform()) {
                    const { AdMob } = Capacitor.Plugins;
                    AdMob.initialize({
                        requestTrackingAuthorization: true,
                        initializeForTesting: false // Live production ad units
                    }).then(() => {
                        triggerAppOpenAd();
                        triggerBannerAd();
                        if (localCachedBroadcasts.length > 0) renderFilteredBroadcasts();
                    }).catch(err => console.warn("AdMob initialize:", err));
                } else {
                    triggerAppOpenAd();
                    triggerBannerAd();
                    if (localCachedBroadcasts.length > 0) renderFilteredBroadcasts();
                }
            });
        }

        // =========================================================================
        // AD 3: APP OPEN AD
        // =========================================================================
        async function triggerAppOpenAd() {
            if (!window.globalAdConfig?.status) return;
            if (window.globalAdConfig?.placements?.appOpenAdStart && window.globalAdConfig.appOpenId) {
                if (window.Capacitor && window.Capacitor.isNativePlatform()) {
                    const { AdMob, App } = Capacitor.Plugins;
                    
                    const showAd = async () => {
                        try {
                            await AdMob.prepareAppOpenAd({ 
                                adId: window.globalAdConfig.appOpenId,
                                isTesting: false 
                            });
                            await AdMob.showAppOpenAd();
                        } catch (e) { console.warn("App Open error:", e); }
                    };

                    if (!hasTriggeredAppOpen) {
                        hasTriggeredAppOpen = true;
                        await showAd();
                    }

                    if (App) {
                        App.addListener('appStateChange', ({ isActive }) => {
                            if (isActive) showAd();
                        });
                    }
                }
            }
        }

        // =========================================================================
        // AD 4: BOTTOM BANNER AD (Native Overlay & Web Fallback)
        // =========================================================================
        async function triggerBannerAd() {
            if (!window.globalAdConfig?.status) return;
            if (window.globalAdConfig?.placements?.bannerAdHomePage && window.globalAdConfig.bannerId) {
                if (window.Capacitor && window.Capacitor.isNativePlatform()) {
                    const { AdMob } = Capacitor.Plugins;
                    try {
                        await AdMob.showBanner({ 
                            adId: window.globalAdConfig.bannerId, 
                            isTesting: false,
                            position: 'BOTTOM_CENTER', 
                            margin: 72 // Clearance above bottom navigation menu
                        });
                        document.body.classList.add('admob-active-nav');
                    } catch (e) { console.warn("Banner error:", e); }
                } else {
                    // Mobile Web Fallback Banner
                    const webBannerWrapper = document.getElementById('webBottomAdWrapper');
                    if (webBannerWrapper) {
                        webBannerWrapper.style.display = 'flex';
                        webBannerWrapper.innerHTML = `
                            <div style="display:flex; align-items:center; justify-content:space-between; width:100%; max-width:420px; padding:6px 16px;">
                                <div style="display:flex; align-items:center; gap:8px;">
                                    <span class="admob-badge-label" style="margin:0;">Ad</span>
                                    <span style="font-size:12px; font-weight:700; color:#081B38;">Remote Work & Tech Tips</span>
                                </div>
                                <a href="https://shiqela.online/" target="_blank" style="background:#1a73e8; color:#ffffff; padding:5px 12px; border-radius:4px; font-size:11px; font-weight:700; text-decoration:none;">JOIN</a>
                            </div>
                        `;
                        document.body.classList.add('admob-active-nav');
                    }
                }
            }
        }

        // =========================================================================
        // AD 5: INTERSTITIAL AD (Fires when opening an article)
        // =========================================================================
        async function showInterstitialAd(onAdClosedCallback) {
            if (window.globalAdConfig?.status && window.globalAdConfig?.placements?.interstitialAdPostDetails && window.globalAdConfig.interstitialId) {
                triggerUiPopup("⏳", "Loading Article", "Please wait while we load content...");
                const popupBtn = document.getElementById('closePopupBtn');
                if (popupBtn) popupBtn.style.display = 'none';

                if (window.Capacitor && window.Capacitor.isNativePlatform()) {
                    const { AdMob } = Capacitor.Plugins;
                    try {
                        await AdMob.prepareInterstitial({ 
                            adId: window.globalAdConfig.interstitialId,
                            isTesting: false 
                        });
                        document.getElementById('customPopupModule').classList.remove('show-popup');
                        if (popupBtn) popupBtn.style.display = 'block';
                        
                        await AdMob.showInterstitial();
                        onAdClosedCallback();
                    } catch (e) {
                        console.warn("Interstitial Error:", e);
                        document.getElementById('customPopupModule').classList.remove('show-popup');
                        if (popupBtn) popupBtn.style.display = 'block';
                        onAdClosedCallback(); 
                    }
                } else {
                    setTimeout(() => {
                        document.getElementById('customPopupModule').classList.remove('show-popup');
                        if (popupBtn) popupBtn.style.display = 'block';
                        onAdClosedCallback();
                    }, 400);
                }
            } else {
                onAdClosedCallback(); 
            }
        }

        function getYouTubeEmbedUrl(url) {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = String(url).trim().match(regExp);
            return (match && match.length === 11) ? `https://www.youtube.com/embed/${match}` : null;
        }

        function initiateLiveInterfaceClocks() {
            const cornerClockNode = document.getElementById('topCornerLiveClock');
            
            if (cardClockIntervalId) clearInterval(cardClockIntervalId);
            cardClockIntervalId = setInterval(() => {
                const now = new Date();
                if (cornerClockNode) {
                    cornerClockNode.innerText = now.toLocaleTimeString(undefined, {
                        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
                    });
                }

                const clockNodes = document.querySelectorAll('.timestamp-log-text[data-timestamp]');
                clockNodes.forEach(node => {
                    const rawTime = parseInt(node.getAttribute('data-timestamp'));
                    if (rawTime && !isNaN(rawTime)) {
                        node.innerText = formatExactTimestampWithSeconds(rawTime);
                    }
                });
            }, 1000);
        }

        function formatExactTimestampWithSeconds(baseEpoch) {
            const dateObj = new Date(baseEpoch);
            if (isNaN(dateObj.getTime())) return "Recent";
            return dateObj.toLocaleDateString(undefined, { 
                month: 'short', day: 'numeric', year: 'numeric' 
            }) + ' • ' + dateObj.toLocaleTimeString(undefined, { 
                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true 
            });
        }

        function extractValidTimestamp(item) {
            const raw = item.timestamp || item.updatedAt || item.createdAtTimestamp || item.createdAt || item.date;
            if (typeof raw === 'number' && !isNaN(raw)) return raw;
            if (typeof raw === 'string') {
                const parsed = parseInt(raw, 10);
                if (!isNaN(parsed) && parsed > 1000000000) {
                    return parsed < 100000000000 ? parsed * 1000 : parsed;
                }
                const dateParsed = new Date(raw).getTime();
                if (!isNaN(dateParsed)) return dateParsed;
            }
            return Date.now();
        }

        function rebuildAndRenderBroadcastsCache() {
            localCachedBroadcasts = [];

            Object.keys(rawShikelaNewsData).forEach(key => {
                const item = rawShikelaNewsData[key];
                if (typeof item === 'object' && item !== null) {
                    localCachedBroadcasts.push({
                        id: key,
                        _dbPath: 'shikelaNews',
                        ...item,
                        title: item.title || item.newsTitle || "Shikela Update",
                        category: item.category || "Shikela Update",
                        resolvedTimestamp: extractValidTimestamp(item)
                    });
                }
            });

            Object.keys(rawNewNewsData).forEach(key => {
                const item = rawNewNewsData[key];
                if (typeof item === 'object' && item !== null) {
                    localCachedBroadcasts.push({
                        id: key,
                        _dbPath: 'newNews',
                        ...item,
                        title: item.title || item.newsTitle || "Shikela Tip",
                        category: item.category || "Shikela Tips",
                        resolvedTimestamp: extractValidTimestamp(item)
                    });
                }
            });

            localCachedBroadcasts.sort((a, b) => b.resolvedTimestamp - a.resolvedTimestamp);
            renderFilteredBroadcasts();
        }

        function streamLiveAdminUpdatesLog() {
            const shikelaNewsRef = ref(db, `${APP_NODE_NAME}/shikelaNews`);
            const newNewsRef = ref(db, `${APP_NODE_NAME}/newNews`);

            onValue(shikelaNewsRef, (snapshot) => {
                rawShikelaNewsData = snapshot.exists() ? snapshot.val() : {};
                rebuildAndRenderBroadcastsCache();
            });

            onValue(newNewsRef, (snapshot) => {
                rawNewNewsData = snapshot.exists() ? snapshot.val() : {};
                rebuildAndRenderBroadcastsCache();
            });
        }

        function renderEmptyState() {
            const container = document.getElementById('broadcastsContainer');
            if (!container) return;
            const displayFilter = currentActiveCategoryFilter.replace('Shikela', 'Yala Tech');
            container.innerHTML = `
                <article class="featured-broadcast-card">
                    <div class="badge-meta-row"><span class="spotlight-pill">Yala Tech Network</span></div>
                    <h2 class="broadcast-title">All Systems Nominal</h2>
                    <p class="broadcast-body-text">There are no updates or notices posted under <strong>${displayFilter}</strong> today.</p>
                </article>
            `;
        }

        window.duplicateAsAdmin = async function(itemId) {
            const sourceItem = localCachedBroadcasts.find(n => n.id === itemId);
            if (!sourceItem) {
                triggerUiPopup("⚠️", "Error", "Target article to duplicate was not found.");
                return;
            }

            try {
                const clonedPayload = { ...sourceItem };
                const targetNodePath = clonedPayload._dbPath || `shikelaNews`;
                
                delete clonedPayload.id;
                delete clonedPayload._dbPath;
                delete clonedPayload.resolvedTimestamp;

                const now = Date.now();
                clonedPayload.createdAtTimestamp = now;
                clonedPayload.updatedAt = now;
                clonedPayload.timestamp = now;
                
                const currentTitle = clonedPayload.title || clonedPayload.newsTitle || "Untitled";
                clonedPayload.title = `${currentTitle} (Copy)`;

                const currentCode = clonedPayload.newsCode || clonedPayload.code || "";
                if (currentCode) clonedPayload.newsCode = `${currentCode}_COPY`;

                const nodeRef = ref(db, `${APP_NODE_NAME}/${targetNodePath}`);
                const newRef = push(nodeRef);
                await set(newRef, clonedPayload);

                triggerUiPopup("✅", "Article Duplicated", `Successfully duplicated item.`);
            } catch (err) {
                console.error("Duplication failed:", err);
                triggerUiPopup("❌", "Duplication Error", "Failed to duplicate item.");
            }
        };

        function buildSingleNewsCardHTML(item) {
            const headline = item.title || item.newsTitle || "Yala Tech Update";
            const fullContent = item.content || item.message || "";
            const displayCategory = (item.category || "Yala Tech Update").replace('Shikela', 'Yala Tech'); 
            const category = item.category || "Shikela Update";
            const imageUrl = item.imageUrl || item.image || "";

            const maxPreviewLen = 120;
            const previewContent = fullContent.length > maxPreviewLen ? fullContent.substring(0, maxPreviewLen).trim() + "..." : fullContent;

            const numericalTime = item.resolvedTimestamp || Date.now();
            const initialFormattedClock = formatExactTimestampWithSeconds(numericalTime);
            
            const isTips = category.trim().toLowerCase().includes("tips");
            const pillBadgeClass = isTips ? "spotlight-pill system-badge" : "spotlight-pill";

            let imageHTML = "";
            if (imageUrl && imageUrl.trim().length > 0) {
                imageHTML = `<div class="broadcast-image-frame" onclick="openFullNewsReader('${item.id}')"><img src="${imageUrl}" onload="this.classList.add('loaded')"></div>`;
            }

            let adminBtnHTML = "";
            if (isAdminMode) {
                adminBtnHTML = `
                    <div class="admin-action-row">
                        <button class="admin-duplicate-btn" onclick="duplicateAsAdmin('${item.id}')">📋 Duplicate Post</button>
                    </div>
                `;
            }

            return `
                ${adminBtnHTML}
                <div class="badge-meta-row">
                    <div style="display:flex; align-items:center; gap:6px;">
                        <span class="${pillBadgeClass}" style="text-transform: uppercase;">${displayCategory}</span>
                    </div>
                    <span class="timestamp-log-text" data-timestamp="${numericalTime}">${initialFormattedClock}</span>
                </div>
                ${imageHTML}
                <div class="clickable-news-content" onclick="openFullNewsReader('${item.id}')">
                    <h2 class="broadcast-title">${headline}</h2>
                    <p class="broadcast-body-text">${previewContent}</p>
                </div>
            `;
        }

        window.openFullNewsReader = function(itemId) {
            if (isOpeningArticle) return;
            isOpeningArticle = true;

            // Trigger Interstitial Ad before revealing article
            showInterstitialAd(() => {
                executeOpenReader(itemId);
                isOpeningArticle = false;
            });
        };

        function executeOpenReader(itemId) {
            const item = localCachedBroadcasts.find(n => n.id === itemId);
            if (!item) return;

            const readerOverlay = document.getElementById('fullNewsModalOverlay');
            const readerBody = document.getElementById('fullNewsReaderBody');
            if (!readerOverlay || !readerBody) return;

            const headline = item.title || item.newsTitle || "Yala Tech Update";
            const fullContent = item.content || item.message || "";
            const displayCategory = (item.category || "Yala Tech Update").replace('Shikela', 'Yala Tech');
            const category = item.category || "Shikela Update";
            const imageUrl = item.imageUrl || item.image || "";
            const videoUrl = item.videoUrl || item.youtubeUrl || item.youtubeId || item.video || "";
            
            const isDuplicateActive = Boolean(item.duplicateCoverInArticle ?? item.duplicateImageInArticle ?? item.duplicateImage ?? true);
            const targetRedirectUrl = item.link || item.redirectUrl || item.url || item.targetUrl || "";
            const customActionLabel = item.actionButtonLabel || item.actionLabel || item.buttonLabel || item.btnLabel || "Visit External Source / Link";

            const numericalTime = item.resolvedTimestamp || Date.now();
            const initialFormattedClock = formatExactTimestampWithSeconds(numericalTime);
            const isTips = category.trim().toLowerCase().includes("tips");
            const pillBadgeClass = isTips ? "spotlight-pill system-badge" : "spotlight-pill";

            let imageHTML = "";
            if (imageUrl && imageUrl.trim().length > 0 && isDuplicateActive) {
                imageHTML = `<div class="reader-image-frame"><img src="${imageUrl.trim()}" alt="${headline}"></div>`;
            }

            let videoHTML = "";
            const embedUrl = getYouTubeEmbedUrl(videoUrl);
            if (embedUrl) {
                videoHTML = `
                    <div class="reader-video-container">
                        <iframe src="${embedUrl}" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
                    </div>
                `;
            }

            let redirectBtnHTML = "";
            if (targetRedirectUrl && targetRedirectUrl.trim().length > 0) {
                redirectBtnHTML = `
                    <div style="margin-top:20px;">
                        <a href="${targetRedirectUrl.trim()}" target="_blank" rel="noopener noreferrer" class="redirect-link-btn" style="width:100%; justify-content:center;">
                            <span>${customActionLabel}</span>
                            <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                        </a>
                    </div>
                `;
            }

            // In-Article Ad (Native card or 300x250)
            let endOfArticleAd = "";
            if (window.globalAdConfig?.placements?.nativeAdPostDetails && window.globalAdConfig.nativeId) {
                endOfArticleAd = getNativeAdHTML(window.globalAdConfig.nativeId);
            } else if (window.globalAdConfig?.placements?.bannerAdPostDetails && window.globalAdConfig.bannerId) {
                endOfArticleAd = getWideBannerAdHTML(window.globalAdConfig.bannerId);
            }

            let adminDuplicateBtnReader = "";
            if (isAdminMode) {
                adminDuplicateBtnReader = `
                    <button class="admin-duplicate-btn" style="margin-bottom: 12px; width: 100%;" onclick="duplicateAsAdmin('${item.id}')">📋 Duplicate Article Entry</button>
                `;
            }

            readerBody.innerHTML = `
                ${adminDuplicateBtnReader}
                <div class="reader-meta-bar">
                    <div style="display:flex; align-items:center; gap:6px;">
                        <span class="${pillBadgeClass}" style="text-transform: uppercase;">${displayCategory}</span>
                    </div>
                    <span class="timestamp-log-text">${initialFormattedClock}</span>
                </div>
                <h1 class="reader-title">${headline}</h1>
                ${imageHTML}
                ${videoHTML}
                <div class="reader-full-body">${fullContent}</div>
                ${redirectBtnHTML}
                ${endOfArticleAd}
            `;

            readerOverlay.classList.add('active-reader');
        }

        function setupNewsReaderModalControls() {
            const closeBtn = document.getElementById('closeNewsReaderBtn');
            const readerOverlay = document.getElementById('fullNewsModalOverlay');

            if (closeBtn && readerOverlay) {
                closeBtn.addEventListener('click', () => {
                    readerOverlay.classList.remove('active-reader');
                });
            }
        }

        function renderFilteredBroadcasts() {
            const container = document.getElementById('broadcastsContainer');
            if (!container) return;
            container.innerHTML = "";

            const filtered = localCachedBroadcasts.filter(item => {
                const nodeCategory = (item.category || "").trim().toLowerCase();
                const targetFilter = currentActiveCategoryFilter.trim().toLowerCase();
                return nodeCategory === targetFilter;
            });

            if (filtered.length === 0) {
                renderEmptyState();
                return;
            }

            let currentPostCount = 0;
            filtered.forEach((item) => {
                const card = document.createElement('article');
                card.className = "featured-broadcast-card";
                card.innerHTML = buildSingleNewsCardHTML(item);
                container.appendChild(card);

                currentPostCount++;

                // In-Feed Native Ad inserted every 2 posts
                if (currentPostCount % 2 === 0) {
                    if (window.globalAdConfig?.placements?.nativeAdPostList && window.globalAdConfig.nativeId) {
                        const nativeAdCard = document.createElement('article');
                        nativeAdCard.className = "featured-broadcast-card";
                        nativeAdCard.innerHTML = getNativeAdHTML(window.globalAdConfig.nativeId);
                        container.appendChild(nativeAdCard);
                    }
                }
            });
        }

        function bindVisualInterfaceControls() {
            const pills = document.querySelectorAll('.filter-btn, .filter-pill');

            pills.forEach(pill => {
                pill.addEventListener('click', function() {
                    pills.forEach(p => {
                        p.classList.remove('active-pill');
                        p.classList.remove('active');
                    });
                    this.classList.add('active-pill');
                    this.classList.add('active');
                    
                    currentActiveCategoryFilter = this.getAttribute('data-filter') || this.getAttribute('data-category') || "Shikela Update";
                    renderFilteredBroadcasts();
                });
            });
        }

        function setupSearchEngineControls() {
            const openBtn = document.getElementById('openSearchBtn');
            const closeBtn = document.getElementById('closeSearchDrawerBtn');
            const searchOverlay = document.getElementById('searchModalOverlay');
            const searchInput = document.getElementById('newsCodeSearchInput');

            if (openBtn && searchOverlay) {
                openBtn.addEventListener('click', () => {
                    searchOverlay.classList.add('active-search');
                    if (searchInput) {
                        searchInput.value = '';
                        searchInput.focus();
                    }
                    executeNewsSearchQuery('');
                });
            }

            if (closeBtn && searchOverlay) {
                closeBtn.addEventListener('click', () => {
                    searchOverlay.classList.remove('active-search');
                });
            }

            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    executeNewsSearchQuery(e.target.value);
                });
            }
        }

        function executeNewsSearchQuery(query) {
            const resultsArea = document.getElementById('searchResultsArea');
            if (!resultsArea) return;

            const cleanQuery = query.trim().toLowerCase();

            if (!cleanQuery) {
                resultsArea.innerHTML = `
                    <div style="text-align:center; padding:30px 20px; color:#ffffff; font-size:13px; font-weight:600;">
                        Type a post code above to find updates quickly.
                    </div>
                `;
                return;
            }

            const matchedNews = localCachedBroadcasts.filter(item => {
                const code = String(item.newsCode || item.code || item.id || '').toLowerCase();
                const title = String(item.title || item.newsTitle || '').toLowerCase();
                const content = String(item.content || item.message || '').toLowerCase();

                return code.includes(cleanQuery) || title.includes(cleanQuery) || content.includes(cleanQuery);
            });

            if (matchedNews.length === 0) {
                resultsArea.innerHTML = `
                    <div style="text-align:center; padding:30px 20px; color:#ffffff; font-size:13px; font-weight:600;">
                        No updates matching "<strong>${cleanQuery}</strong>" found.
                    </div>
                `;
                return;
            }

            resultsArea.innerHTML = '';
            let searchCount = 0;
            matchedNews.forEach((item) => {
                const card = document.createElement('article');
                card.className = "featured-broadcast-card";
                card.innerHTML = buildSingleNewsCardHTML(item);
                resultsArea.appendChild(card);

                searchCount++;

                // In-Search Native Ad inserted every 2 search results
                if (searchCount % 2 === 0) {
                    if (window.globalAdConfig?.placements?.nativeAdPostList && window.globalAdConfig.nativeId) {
                        const nativeAdCard = document.createElement('article');
                        nativeAdCard.className = "featured-broadcast-card";
                        nativeAdCard.innerHTML = getNativeAdHTML(window.globalAdConfig.nativeId);
                        resultsArea.appendChild(nativeAdCard);
                    }
                }
            });
        }

        function triggerUiPopup(icon, title, desc) {
            const overlay = document.getElementById('customPopupModule');
            const iconNode = document.getElementById('popupIconNode');
            const titleNode = document.getElementById('popupTitleNode');
            const descNode = document.getElementById('popupDescNode');
            const dismissBtn = document.getElementById('closePopupBtn');
            
            if (overlay && iconNode && titleNode && descNode) {
                if (dismissBtn) {
                    dismissBtn.innerText = "Continue";
                    dismissBtn.onclick = () => overlay.classList.remove('show-popup');
                }

                iconNode.innerText = icon;
                iconNode.style.display = "inline-block";
                titleNode.innerText = title;
                descNode.innerText = desc;
                overlay.classList.add('show-popup');
            }
        }
    </script>

    <!-- Script to manage iframe drawer toggling -->
    <script>
        const openBtn = document.getElementById('openMenuIframeBtn');
        const overlay = document.getElementById('menuIframeOverlay');
        const iframe = document.getElementById('menuIframe');

        openBtn.addEventListener('click', () => {
            iframe.src = 'menu.html';
            overlay.classList.add('active');
        });

        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) {
                overlay.classList.remove('active');
            }
        });
    </script>
