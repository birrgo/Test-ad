name: Build Fira Pro APK

on:

  workflow_dispatch:

  push:
    branches:
      - main


jobs:

  build:

    runs-on: ubuntu-latest


    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Setup Node
      # --------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # --------------------------------------------------
      # 3. Setup Java
      # --------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      # --------------------------------------------------
      # 4. Install dependencies
      # --------------------------------------------------

      - name: Install Dependencies
        run: |

          npm install


      # --------------------------------------------------
      # 5. Install Capacitor CLI
      # --------------------------------------------------

      - name: Check Capacitor
        run: |

          npx cap --version


      # --------------------------------------------------
      # 6. Create Android project
      # --------------------------------------------------

      - name: Create Android Project
        run: |

          if [ ! -d "android" ]; then

            npx cap add android

          else

            echo "Android project already exists."

          fi


      # --------------------------------------------------
      # 7. Prepare web directory
      # --------------------------------------------------

      - name: Prepare Web Files
        run: |

          mkdir -p www

          cp -f *.html www/ 2>/dev/null || true
          cp -f *.css www/ 2>/dev/null || true
          cp -f *.js www/ 2>/dev/null || true
          cp -f *.json www/ 2>/dev/null || true
          cp -f *.png www/ 2>/dev/null || true
          cp -f *.jpg www/ 2>/dev/null || true
          cp -f *.jpeg www/ 2>/dev/null || true
          cp -f *.webp www/ 2>/dev/null || true
          cp -f *.svg www/ 2>/dev/null || true

          echo "Web files prepared."

          ls -la www


      # --------------------------------------------------
      # 8. Verify required images
      # --------------------------------------------------

      - name: Verify App Images
        run: |

          echo "Checking application images..."

          if [ ! -f "s.png" ]; then

            echo "ERROR: s.png was not found."

            exit 1

          fi

          if [ ! -f "s1.png" ]; then

            echo "ERROR: s1.png was not found."

            exit 1

          fi

          echo "s.png found."
          echo "s1.png found."


      # --------------------------------------------------
      # 9. Copy startup image to www
      # --------------------------------------------------

      - name: Install Welcome Image
        run: |

          cp -f s1.png www/s1.png

          echo "Welcome image installed."


      # --------------------------------------------------
      # 10. Prepare launcher icon
      # --------------------------------------------------

      - name: Prepare App Icon
        run: |

          cp -f s.png s_valid.png

          echo "Application icon prepared."

          file s_valid.png


      # --------------------------------------------------
      # 11. Install launcher icons
      #
      # IMPORTANT:
      # Do NOT copy icons into mipmap-anydpi-v26.
      # That was the cause of the duplicate resource
      # problem in the previous build.
      # --------------------------------------------------

      - name: Install Android App Icon
        run: |

          for dir in \
            android/app/src/main/res/mipmap-mdpi \
            android/app/src/main/res/mipmap-hdpi \
            android/app/src/main/res/mipmap-xhdpi \
            android/app/src/main/res/mipmap-xxhdpi \
            android/app/src/main/res/mipmap-xxxhdpi
          do

            if [ -d "$dir" ]; then

              cp -f \
                s_valid.png \
                "$dir/ic_launcher.png"

              cp -f \
                s_valid.png \
                "$dir/ic_launcher_round.png"

              echo "Updated icon: $dir"

            fi

          done


      # --------------------------------------------------
      # 12. Setup splash image
      #
      # s1.png = welcome image
      # --------------------------------------------------

      - name: Setup Splash Screen
        run: |

          mkdir -p \
            android/app/src/main/res/drawable

          cp -f \
            s1.png \
            android/app/src/main/res/drawable/splash.png

          echo "s1.png installed as splash.png."


      # --------------------------------------------------
      # 13. Configure Capacitor
      # --------------------------------------------------

      - name: Write Capacitor Configuration
        run: |

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.firapro.app",
            "appName": "Fira Pro",
            "webDir": "www",
            "bundledWebRuntime": false,
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 1500,
                "launchAutoHide": true,
                "backgroundColor": "#001a66",
                "showSpinner": false
              }
            }
          }
          EOF

          echo "Capacitor configuration created."


      # --------------------------------------------------
      # 14. Sync Capacitor
      #
      # This also runs:
      #
      # admob-manifest.js
      # admob-native.js
      #
      # so Native Ads are installed.
      # --------------------------------------------------

      - name: Sync Capacitor
        run: |

          npx cap sync android


      # --------------------------------------------------
      # 15. Verify Android
      # --------------------------------------------------

      - name: Verify Android Project
        run: |

          echo "Android project ready."

          test -d android/app

          echo "Android application directory found."


      # --------------------------------------------------
      # 16. Build DEBUG APK
      # --------------------------------------------------

      - name: Build Installable Debug APK
        run: |

          cd android

          chmod +x ./gradlew

          ./gradlew clean

          ./gradlew assembleDebug --stacktrace


      # --------------------------------------------------
      # 17. Find APK
      # --------------------------------------------------

      - name: Prepare APK
        run: |

          APK=$(find \
            android/app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)


          if [ -z "$APK" ]; then

            echo "ERROR: APK was not created."

            exit 1

          fi


          cp "$APK" fira-pro.apk


          echo "================================"
          echo "FIRA PRO APK CREATED"
          echo "================================"

          ls -lh fira-pro.apk


      # --------------------------------------------------
      # 18. Upload APK
      # --------------------------------------------------

      - name: Upload Installable APK
        uses: actions/upload-artifact@v4

        with:

          name: fira-pro-apk

          path: fira-pro.apk

          if-no-files-found: error
