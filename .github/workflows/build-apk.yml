name: Convert PWA to Installable APK 

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor, Splash Screen, App & AdMob Plugins
        run: |
          npm init -y
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5 @capacitor/splash-screen@5 @capacitor/app@5 @capacitor-community/admob@5

      - name: Bundle Web Files
        run: |
          mkdir -p www
          rsync -av --exclude='.git' --exclude='.github' --exclude='www' --exclude='android' ./ www/
          # Ensure index.html exists
          if [ ! -f www/index.html ]; then
            first_html=$(find www/ -maxdepth 1 -name "*.html" | head -n 1)
            if [ -n "$first_html" ]; then
              cp "$first_html" www/index.html
            fi
          fi

      - name: Create Capacitor Config Safely
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.firapro.app",
            "appName": "Fira Pro",
            "webDir": "www",
            "bundledWebRuntime": false,
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 2000,
                "launchAutoHide": true,
                "backgroundColor": "#001a66",
                "showSpinner": false
              }
            }
          }
          EOF

      - name: Initialize & Sync Android Project
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure AdMob App ID & Advertising Permissions in AndroidManifest
        run: |
          # If you have your real AdMob App ID from your AdMob console, put it here:
          # Format must strictly be numbers: ca-app-pub-XXXXXXXXXXXXXXXX~YYYYYYYYYY
          REAL_APP_ID="ca-app-pub-3940256099942544~3347511713"

          python3 - <<EOF
          import xml.etree.ElementTree as ET

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          ET.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          tree = ET.parse(manifest_path)
          root = tree.getroot()
          ns = {'android': 'http://schemas.android.com/apk/res/android'}

          # 1. Add AD_ID permission
          perm_exists = False
          for perm in root.findall('uses-permission'):
              if perm.attrib.get('{http://schemas.android.com/apk/res/android}name') == 'com.google.android.gms.permission.AD_ID':
                  perm_exists = True
                  break
          if not perm_exists:
              new_perm = ET.Element('uses-permission')
              new_perm.set('{http://schemas.android.com/apk/res/android}name', 'com.google.android.gms.permission.AD_ID')
              root.insert(0, new_perm)

          # 2. Add AdMob APPLICATION_ID metadata inside <application>
          app_elem = root.find('application')
          if app_elem is not None:
              meta_exists = False
              for meta in app_elem.findall('meta-data'):
                  if meta.attrib.get('{http://schemas.android.com/apk/res/android}name') == 'com.google.android.gms.ads.APPLICATION_ID':
                      meta.set('{http://schemas.android.com/apk/res/android}value', '$REAL_APP_ID')
                      meta_exists = True
                      break
              if not meta_exists:
                  new_meta = ET.SubElement(app_elem, 'meta-data')
                  new_meta.set('{http://schemas.android.com/apk/res/android}name', 'com.google.android.gms.ads.APPLICATION_ID')
                  new_meta.set('{http://schemas.android.com/apk/res/android}value', '$REAL_APP_ID')

          tree.write(manifest_path, encoding='utf-8', xml_declaration=True)
          EOF

      - name: Target Stable API Level 34
        run: |
          if [ -f android/variables.gradle ]; then
            sed -i 's/targetSdkVersion = .*/targetSdkVersion = 34/' android/variables.gradle
            sed -i 's/compileSdkVersion = .*/compileSdkVersion = 34/' android/variables.gradle
          fi
          sed -i 's/targetSdkVersion .*/targetSdkVersion 34/' android/app/build.gradle
          sed -i 's/compileSdkVersion .*/compileSdkVersion 34/' android/app/build.gradle

      - name: Set Version Code
        run: |
          sed -i 's/versionCode .*/versionCode 3/' android/app/build.gradle
          sed -i 's/versionName .*/versionName "3.0"/' android/app/build.gradle

      - name: Clean & Setup App Icons and Splash Drawables
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          mkdir -p android/app/src/main/res/drawable

          if [ -f s.png ]; then
            convert s.png -strip s_valid.png
            
            # Setup Launcher Icons
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for dir in android/app/src/main/res/mipmap-*/; do
              cp -f s_valid.png "${dir}ic_launcher.png" 2>/dev/null || true
              cp -f s_valid.png "${dir}ic_launcher_round.png" 2>/dev/null || true
            done
            
            # Setup Splash Screen Drawable
            cp -f s_valid.png android/app/src/main/res/drawable/splash.png
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build Auto-Signed Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Move & Rename APK Output
        run: mv android/app/build/outputs/apk/debug/*.apk fira-pro.apk

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fira-pro-apk
          path: fira-pro.apk
