name: Convert PWA to Installable APK 

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor, Splash Screen, App & AdMob Plugins
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/splash-screen @capacitor/app @capacitor-community/admob

      - name: Bundle Web Files
        run: |
          mkdir www
          rsync -av --exclude='.git' --exclude='.github' --exclude='www' ./ www/

      - name: Create Capacitor Config Safely
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.firapro.app",
            "appName": "Fira Pro",
            "webDir": "www",
            "bundledWebRuntime": false,
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 3000,
                "launchAutoHide": true,
                "backgroundColor": "#001a66",
                "androidSplashResourceName": "splash",
                "androidScaleType": "CENTER_CROP",
                "splashFullScreen": true,
                "splashImmersive": true,
                "showSpinner": false
              }
            }
          }
          EOF

      - name: Initialize & Sync Android Project
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Real AdMob App ID & Advertising Permissions
        run: |
          # REPLACE WITH YOUR REAL ADMOB APP ID FROM ADMOB CONSOLE (has a '~')
          REAL_APP_ID="ca-app-pub-6417058236150000~XXXXXXXXXX"
          
          sed -i "/<\/application>/i \        <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$REAL_APP_ID\"/>" android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="com.google.android.gms.permission.AD_ID" \/>' android/app/src/main/AndroidManifest.xml

      - name: Target API Level 35 (Google Play Standard)
        run: |
          if [ -f android/variables.gradle ]; then
            sed -i 's/targetSdkVersion = .*/targetSdkVersion = 35/' android/variables.gradle
            sed -i 's/compileSdkVersion = .*/compileSdkVersion = 35/' android/variables.gradle
          fi
          sed -i 's/targetSdkVersion .*/targetSdkVersion 35/' android/app/build.gradle
          sed -i 's/compileSdkVersion .*/compileSdkVersion 35/' android/app/build.gradle

      - name: Set Version Code to 3
        run: |
          sed -i 's/versionCode 1/versionCode 3/' android/app/build.gradle
          sed -i 's/versionCode 2/versionCode 3/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "3.0"/' android/app/build.gradle
          sed -i 's/versionName "2.0"/versionName "3.0"/' android/app/build.gradle

      - name: Fix Android Hardware Back Button
        run: |
          mkdir -p android/app/src/main/java/com/firapro/app
          cat << 'EOF' > android/app/src/main/java/com/firapro/app/MainActivity.java
          package com.firapro.app;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onBackPressed() {
                  if (this.bridge != null && this.bridge.getWebView() != null && this.bridge.getWebView().canGoBack()) {
                      this.bridge.getWebView().goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Setup App Icon
        run: |
          if [ -f s.png ]; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
            
            convert s.png -strip s_valid.png
            
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            find android/app/src/main/res -name "ic_launcher*" -type f -delete
            
            for dir in android/app/src/main/res/mipmap-*/; do
              cp -f s_valid.png "${dir}ic_launcher.png" 2>/dev/null || true
              cp -f s_valid.png "${dir}ic_launcher_round.png" 2>/dev/null || true
            done
          fi

      - name: Fix Kotlin Clashes
        run: |
          echo "" >> android/app/build.gradle
          echo "configurations.all {" >> android/app/build.gradle
          echo "    resolutionStrategy {" >> android/app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'" >> android/app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'" >> android/app/build.gradle
          echo "        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'" >> android/app/build.gradle
          echo "    }" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build Auto-Signed Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Move & Rename APK Output
        run: mv android/app/build/outputs/apk/debug/*.apk fira-pro.apk

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fira-pro-apk
          path: fira-pro.apk
