name: Build Fira Pro APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Checkout repository
      # ==================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. Setup Node.js
      #
      # Capacitor 8 requires Node.js 22+
      # No npm cache because repository has no lock file.
      # ==================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ==================================================
      # 3. Setup Java
      #
      # Capacitor 8 Android build uses Java 21.
      # ==================================================

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      # ==================================================
      # 4. Show versions
      # ==================================================

      - name: Show Build Versions
        run: |
          echo "=============================="
          echo "NODE"
          echo "=============================="
          node --version

          echo "=============================="
          echo "NPM"
          echo "=============================="
          npm --version

          echo "=============================="
          echo "JAVA"
          echo "=============================="
          java -version

          echo "=============================="
          echo "JAVA HOME"
          echo "=============================="
          echo "$JAVA_HOME"


      # ==================================================
      # 5. Install npm dependencies
      # ==================================================

      - name: Install Dependencies
        run: |
          npm install


      # ==================================================
      # 6. Check Capacitor
      # ==================================================

      - name: Check Capacitor
        run: |
          npx cap --version


      # ==================================================
      # 7. Check package
      # ==================================================

      - name: Check AdMob Plugin
        run: |
          npm list capacitor-admob-nextgen || true


      # ==================================================
      # 8. Create Android project
      # ==================================================

      - name: Create Android Project
        run: |

          if [ ! -d "android" ]; then

            echo "Android project does not exist."
            echo "Creating Android project..."

            npx cap add android

          else

            echo "Android project already exists."

          fi


      # ==================================================
      # 9. Prepare www directory
      # ==================================================

      - name: Prepare Web Files
        run: |

          mkdir -p www

          echo "Copying HTML files..."
          cp -f *.html www/ 2>/dev/null || true

          echo "Copying CSS files..."
          cp -f *.css www/ 2>/dev/null || true

          echo "Copying JavaScript files..."
          cp -f *.js www/ 2>/dev/null || true

          echo "Copying JSON files..."
          cp -f *.json www/ 2>/dev/null || true

          echo "Copying PNG files..."
          cp -f *.png www/ 2>/dev/null || true

          echo "Copying JPG files..."
          cp -f *.jpg www/ 2>/dev/null || true

          echo "Copying JPEG files..."
          cp -f *.jpeg www/ 2>/dev/null || true

          echo "Copying WEBP files..."
          cp -f *.webp www/ 2>/dev/null || true

          echo "Copying SVG files..."
          cp -f *.svg www/ 2>/dev/null || true

          echo ""
          echo "=============================="
          echo "WWW CONTENT"
          echo "=============================="

          ls -lah www


      # ==================================================
      # 10. Verify required images
      #
      # s.png  = application icon (required by Android OS
      #          for the launcher / app drawer — this
      #          cannot be removed, it is a system
      #          requirement, not a Capacitor setting)
      #
      # s1.png = welcome/splash image shown on app open
      # ==================================================

      - name: Verify App Images
        run: |

          echo "Checking required images..."

          if [ ! -f "s.png" ]; then

            echo "ERROR: s.png was not found."

            exit 1

          fi

          if [ ! -f "s1.png" ]; then

            echo "ERROR: s1.png was not found."

            exit 1

          fi

          echo ""
          echo "s.png found:"
          ls -lh s.png

          echo ""
          echo "s1.png found:"
          ls -lh s1.png


      # ==================================================
      # 11. Install welcome image
      # ==================================================

      - name: Install Welcome Image
        run: |

          cp -f s1.png www/s1.png

          echo "s1.png copied to www."


      # ==================================================
      # 12. Prepare launcher icon
      # ==================================================

      - name: Prepare App Icon
        run: |

          cp -f s.png s_valid.png

          echo "Application icon prepared."

          file s_valid.png


      # ==================================================
      # 13. Install launcher icons
      #
      # IMPORTANT:
      #
      # Do NOT copy to:
      #
      # mipmap-anydpi-v26
      #
      # This prevents the duplicate resource error.
      # ==================================================

      - name: Install Android App Icon
        run: |

          for dir in \
            android/app/src/main/res/mipmap-mdpi \
            android/app/src/main/res/mipmap-hdpi \
            android/app/src/main/res/mipmap-xhdpi \
            android/app/src/main/res/mipmap-xxhdpi \
            android/app/src/main/res/mipmap-xxxhdpi
          do

            if [ -d "$dir" ]; then

              cp -f \
                s_valid.png \
                "$dir/ic_launcher.png"

              cp -f \
                s_valid.png \
                "$dir/ic_launcher_round.png"

              echo "Updated icon:"
              echo "$dir"

            fi

          done


      # ==================================================
      # 14. Setup splash image
      #
      # s1.png is used as the native splash image.
      # ==================================================

      - name: Setup Splash Screen
        run: |

          mkdir -p \
            android/app/src/main/res/drawable

          cp -f \
            s1.png \
            android/app/src/main/res/drawable/splash.png

          echo "s1.png installed as splash.png."


      # ==================================================
      # 14b. Suppress Android 12+ system icon splash
      #
      # On Android 12+, the OS shows its OWN splash first
      # (your launcher icon on a plain background) BEFORE
      # Capacitor's SplashScreen plugin can show s1.png.
      # This is a system-level behavior, not something
      # controlled from HTML/JS.
      #
      # Fix: override the v31 theme so the system splash
      # uses a transparent icon + a background color that
      # matches s1.png. This makes the forced system splash
      # invisible/seamless, so the app appears to jump
      # straight to s1.png.
      #
      # Change SPLASH_BG_COLOR below if s1.png's dominant
      # background color is not #001a66.
      # ==================================================

      - name: Suppress Android 12+ Icon Splash
        run: |

          SPLASH_BG_COLOR="#001a66"

          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/values-v31

          # 1x1 fully transparent drawable used as the
          # "animated icon" so nothing visibly renders
          cat > android/app/src/main/res/drawable/splash_transparent.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="@android:color/transparent" />
          </shape>
          EOF

          # Override the Android 12+ splash theme attributes
          cat > android/app/src/main/res/values-v31/styles.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
                  <item name="windowSplashScreenBackground">${SPLASH_BG_COLOR}</item>
                  <item name="windowSplashScreenAnimatedIcon">@drawable/splash_transparent</item>
                  <item name="windowSplashScreenIconBackgroundColor">${SPLASH_BG_COLOR}</item>
                  <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
              </style>
          </resources>
          EOF

          echo "Android 12+ system splash icon suppressed."
          echo "Background color used: ${SPLASH_BG_COLOR}"


      # ==================================================
      # 15. Configure Capacitor
      #
      # launchAutoHide + launchShowDuration control how
      # long Capacitor's OWN splash (s1.png, full screen)
      # stays visible after the OS hands off control to it.
      # ==================================================

      - name: Write Capacitor Configuration
        run: |

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.firapro.app",
            "appName": "Fira Pro",
            "webDir": "www",
            "bundledWebRuntime": false,
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 1500,
                "launchAutoHide": true,
                "backgroundColor": "#001a66",
                "androidScaleType": "CENTER_CROP",
                "showSpinner": false,
                "splashFullScreen": true,
                "splashImmersive": true
              }
            }
          }
          EOF

          echo "Capacitor configuration:"
          cat capacitor.config.json


      # ==================================================
      # 16. Sync Capacitor
      #
      # This installs Capacitor plugins and runs the
      # AdMob NextGen setup scripts defined in package.json
      # (capacitor:sync:after hook — already correctly
      # wired in package.json, no change needed there).
      # ==================================================

      - name: Sync Capacitor
        run: |

          npx cap sync android


      # ==================================================
      # 17. Verify Android project
      # ==================================================

      - name: Verify Android Project
        run: |

          echo "Checking Android project..."

          if [ ! -d "android/app" ]; then

            echo "ERROR: android/app does not exist."

            exit 1

          fi

          if [ ! -f "android/gradlew" ]; then

            echo "ERROR: android/gradlew does not exist."

            exit 1

          fi

          echo "Android project is ready."


      # ==================================================
      # 18. Show Android tool versions
      # ==================================================

      - name: Check Gradle
        run: |

          cd android

          chmod +x ./gradlew

          ./gradlew --version


      # ==================================================
      # 19. Clean Android project
      # ==================================================

      - name: Clean Android Project
        run: |

          cd android

          chmod +x ./gradlew

          ./gradlew clean


      # ==================================================
      # 20. Build DEBUG APK
      #
      # This APK can be installed directly on Android
      # for testing. Uses TEST AdMob IDs (globalAdConfig
      # in the HTML + androidAppId in package.json) —
      # these are Google's official public test IDs and
      # are already correctly configured.
      # ==================================================

      - name: Build Installable Debug APK
        run: |

          cd android

          chmod +x ./gradlew

          ./gradlew assembleDebug --stacktrace


      # ==================================================
      # 21. Find APK
      # ==================================================

      - name: Prepare APK
        run: |

          echo "Searching for APK..."

          APK=$(find \
            android/app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then

            echo "================================"
            echo "ERROR: APK WAS NOT CREATED"
            echo "================================"

            exit 1

          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" fira-pro.apk

          echo ""
          echo "================================"
          echo "FIRA PRO APK CREATED"
          echo "================================"

          ls -lh fira-pro.apk


      # ==================================================
      # 22. Upload APK to GitHub Actions
      # ==================================================

      - name: Upload Installable APK
        uses: actions/upload-artifact@v4

        with:

          name: fira-pro-apk

          path: fira-pro.apk

          if-no-files-found: error
